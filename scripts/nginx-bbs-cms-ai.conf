# Nginx example for BBS-CMS AI behind a public hostname.
# Keep existing /demo/ for any other BBS-CMS frontend.
# Proxy BBS-CMS AI under /ai/ (and optionally /demo/ai/).
#
# Upstream (local uvicorn daemon or systemd on port 8765):
#   ./scripts/run_demo.sh --daemon
#
# Then open: https://YOUR_HOST/ai/v2/

upstream bbs_cms_ai {
    server 127.0.0.1:8765;
    keepalive 8;
}

server {
    listen 80;
    server_name YOUR_HOST.example;

    # Existing static /demo/ app stays as-is (do not replace).

    location /ai/ {
        proxy_pass http://bbs_cms_ai/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /demo/ai/ {
        proxy_pass http://bbs_cms_ai/demo/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # API used by the AI UI (must reach FastAPI, not the static demo).
    location /v1/ {
        proxy_pass http://bbs_cms_ai/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /v2/ {
        proxy_pass http://bbs_cms_ai/v2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://bbs_cms_ai/health;
    }
}
