<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>BBS-CMS AI</title>
<link rel="icon" href="/ai/v2/favicon.svg" type="image/svg+xml">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #141816; --muted: #5f6b64; --line: #e2e6e3; --paper: #f3f5f2;
    --white: #fff; --green: #1a6b4a; --green-deep: #145239; --green-soft: #e6f3ec;
    --danger: #a33a2c; --danger-soft: #f8e9e6; --warn: #8a6a2a; --warn-soft: #f5efdf;
    --shadow: 0 10px 30px rgba(20, 40, 30, .07); --radius: 16px;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(26,107,74,.09), transparent 55%),
      radial-gradient(900px 420px at 100% 0%, rgba(90,120,100,.08), transparent 50%),
      linear-gradient(180deg, #f7f8f5 0%, var(--paper) 40%, #eef1ee 100%);
    font: 14.5px/1.55 "Plus Jakarta Sans", "Noto Sans JP", "Hiragino Sans", sans-serif;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,.88); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(226,230,227,.9); padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  header .brand { display: flex; align-items: center; gap: 12px; }
  header .mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(145deg, var(--green) 0%, var(--green-deep) 100%);
    color: #fff; font-weight: 700; font-size: 12px;
    display: grid; place-items: center; letter-spacing: .02em;
    box-shadow: 0 6px 14px rgba(26,107,74,.28);
  }
  header strong { font-size: 15px; letter-spacing: -.01em; }
  header small { color: var(--muted); display: block; margin-top: 2px; font-size: 12px; }
  .steps {
    display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 24px;
    background: rgba(255,255,255,.55); border-bottom: 1px solid var(--line);
  }
  .steps button {
    border: 1px solid transparent; background: transparent; border-radius: 999px;
    padding: 7px 13px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted);
    transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
  }
  .steps button:hover:not(:disabled) { background: #fff; border-color: var(--line); color: var(--ink); }
  .steps button.on {
    background: var(--green); color: #fff; border-color: var(--green);
    box-shadow: 0 4px 12px rgba(26,107,74,.25);
  }
  .steps button:disabled { opacity: .38; cursor: not-allowed; }
  .prompt-tabs { display:flex; gap:6px; margin:12px 0 10px; flex-wrap:wrap; }
  .prompt-tabs button {
    border:1px solid var(--line); background:#fafbfa; border-radius:999px;
    padding:7px 14px; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--muted);
  }
  .prompt-tabs button.on {
    background:var(--green); color:#fff; border-color:var(--green);
    box-shadow:0 4px 12px rgba(26,107,74,.22);
  }
  .prompt-table { width:100%; border-collapse:collapse; font-size:13px; }
  .prompt-table th, .prompt-table td {
    border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top;
  }
  .prompt-table th { background:#f3f5f2; font-size:12px; color:#3d4a43; }
  .prompt-table .pi-web { color:var(--muted); font-size:11px; margin-top:2px; }
  .prompt-note { margin:8px 0 0; font-size:12px; color:var(--muted); }
  main { max-width: 1080px; margin: 0 auto; padding: 22px 24px 72px; }
  .card {
    background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px 24px; margin-bottom: 16px; box-shadow: var(--shadow);
    animation: rise .35s var(--ease);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.02em; font-weight: 700; }
  p.lead { margin: 0 0 16px; color: var(--muted); font-size: 13.5px; }
  label { display: block; font-size: 12px; font-weight: 700; margin: 12px 0 6px; color: #3d4a43; }
  input[type=text], input[type=password], textarea, select {
    width: 100%; border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font: inherit; background: #fafbfa;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(26,107,74,.14); background: #fff;
  }
  input.invalid, input.invalid:focus {
    border-color: var(--danger); box-shadow: 0 0 0 3px rgba(163,58,44,.12);
  }
  textarea { min-height: 120px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
  .btn {
    border: 0; border-radius: 999px; padding: 11px 18px; font: inherit; font-weight: 700;
    cursor: pointer; background: #e8ebe9; color: var(--ink);
    transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s ease, opacity .15s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn.g {
    background: linear-gradient(180deg, #22855a 0%, var(--green) 100%);
    color: #fff; box-shadow: 0 6px 16px rgba(26,107,74,.22);
  }
  .btn.g:hover:not(:disabled) { box-shadow: 0 8px 20px rgba(26,107,74,.3); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .msg {
    margin-top: 14px; color: var(--muted); font-size: 13px;
    min-height: 1.2em; transition: color .15s ease;
  }
  .msg.ok { color: var(--green); font-weight: 600; }
  .msg.err { color: var(--danger); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
  th { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; background: #eee;
  }
  .badge.ok { background: var(--green-soft); color: var(--green); }
  .badge.fail { background: #f8e8e5; color: var(--danger); }
  .badge.free { background: var(--green-soft); color: var(--green); }
  .badge.paid { background: var(--warn-soft); color: var(--warn); }
  .badge.req { background: var(--danger-soft); color: var(--danger); }
  .badge.saved { background: var(--green-soft); color: var(--green); }
  .badge.role-writer {
    background: #c2185b; color: #fff;
    box-shadow: 0 0 0 1px rgba(194,24,91,.4);
  }
  .badge.role-improve {
    background: #1d5bb8; color: #fff;
    box-shadow: 0 0 0 1px rgba(29,91,184,.35);
  }
  .badge.role-verifier {
    background: #d97706; color: #fff;
    box-shadow: 0 0 0 1px rgba(217,119,6,.45);
  }
  .badge.role-unused { background: #ececec; color: #666; }
  .picker-notes .t-writer { color: #c2185b; font-weight: 700; }
  .picker-notes .t-improve { color: #1d5bb8; font-weight: 700; }
  .picker-notes .t-verifier { color: #d97706; font-weight: 700; }
  .role-td .badge { margin: 0; }
  .pipeline-board {
    display: grid; gap: 8px; margin: 12px 0 4px;
    padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--line); background: #fafbfa;
  }
  .pipeline-board .pb-title {
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 2px;
  }
  .pipeline-board .pb-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 13px;
  }
  .pipeline-board .pb-model { font-weight: 600; }
  .pipeline-board .pb-status {
    font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
    background: #eee; color: #555;
  }
  .pipeline-board .pb-status.ok { background: var(--green-soft); color: var(--green); }
  .pipeline-board .pb-status.timeout,
  .pipeline-board .pb-status.error { background: var(--danger-soft); color: var(--danger); }
  .pipeline-board .pb-status.skipped { background: #eee; color: #777; }
  .picker-notes {
    margin: 0 0 14px; padding: 12px 14px; border-radius: 14px;
    background: linear-gradient(180deg, #f4f7f5, #eef2ef);
    border: 1px solid #e4eae6; color: var(--muted); font-size: 12.5px; line-height: 1.55;
    display: grid; gap: 4px;
  }
  .picker-notes b { color: var(--ink); font-weight: 700; }
  .gate-bar {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    margin-top: 14px; padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--line); background: #fafbfa;
  }
  .gate-bar.ok { border-color: #cfe5d8; background: var(--green-soft); }
  .gate-bar.bad { border-color: #efd2cc; background: var(--danger-soft); }
  .gate-bar .gate-title { font-size: 12px; font-weight: 700; margin: 0 0 2px; color: var(--ink); }
  .gate-bar .gate-hint { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .gate-bar.ok .gate-hint { color: var(--green-deep); }
  .gate-bar.bad .gate-hint { color: var(--danger); }
  .cred-panel {
    margin-top: 14px; padding: 14px; border-radius: 14px;
    border: 1px solid var(--line); background: #fafbfa;
  }
  .cred-panel h3 {
    margin: 0 0 10px; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .dropzone {
    border: 1.5px dashed #c9d2cc; border-radius: 16px; padding: 28px 20px;
    text-align: center; background: linear-gradient(180deg, #fcfdfc, #f4f7f5);
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .dropzone.drag { border-color: var(--green); background: var(--green-soft);
    box-shadow: 0 0 0 4px rgba(26,107,74,.08); }
  .dropzone strong { display: block; font-size: 15px; margin-bottom: 4px; }
  .dropzone p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .hearing-meta {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 4px;
  }
  .hearing-meta .cell {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fafbfa;
  }
  .hearing-meta .k { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .hearing-meta .v { font-size: 14px; font-weight: 600; word-break: break-word; }
  @media (max-width: 800px) {
    .hearing-meta { grid-template-columns: 1fr; }
  }
  .row-add {
    display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap;
  }
  .row-add select {
    flex: 1; min-width: 220px; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font: inherit; background: #fafafa; cursor: pointer;
  }
  .row-add select:focus { outline: 2px solid rgba(31,107,72,.25); border-color: var(--green); }
  .row-add .btn { flex: 0 0 auto; align-self: stretch; border-radius: 12px; }
  .dual-pick {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0 0 8px;
  }
  .dual-pick .pick-box {
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    background: linear-gradient(180deg, #fcfdfc, #f6f8f6); overflow: visible;
  }
  .dual-pick .pick-box h3 {
    margin: 0 0 10px; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .mega-dd { position: relative; z-index: 5; }
  .mega-dd.open { z-index: 50; }
  .mega-trigger {
    width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font: inherit; background: var(--white); cursor: pointer;
    color: var(--ink); display: flex; justify-content: space-between; align-items: center;
  }
  .mega-trigger:hover, .mega-dd.open .mega-trigger {
    border-color: var(--green); outline: 2px solid rgba(31,107,72,.18);
  }
  .mega-trigger .chev { color: var(--muted); font-size: 12px; }
  .mega-panel {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--white); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 28px rgba(0,0,0,.1); padding: 6px; z-index: 30;
    overflow: visible;
  }
  .mega-dd.open .mega-panel { display: block; }
  .mega-co { position: relative; }
  .mega-co-btn {
    width: 100%; text-align: left; border: 0; background: transparent;
    border-radius: 9px; padding: 10px 12px; font: inherit; font-weight: 600;
    cursor: pointer; color: var(--ink); display: flex; justify-content: space-between;
  }
  .mega-co-btn:hover, .mega-co:hover > .mega-co-btn, .mega-co.open > .mega-co-btn {
    background: var(--green-soft); color: var(--green);
  }
  .mega-co-btn .arrow {
    color: var(--muted); font-size: 12px; transition: transform .15s ease;
  }
  .mega-co.open > .mega-co-btn .arrow,
  .mega-co:hover > .mega-co-btn .arrow { color: var(--green); transform: none; }
  /* Nested models: level with hovered company, open to the right (standard cascade). */
  .mega-models {
    display: none; position: absolute;
    top: 0; bottom: auto;
    left: calc(100% + 6px); right: auto;
    min-width: 220px; width: max-content; max-width: 280px;
    max-height: min(320px, 70vh); overflow-y: auto;
    background: var(--white); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 14px 32px rgba(20, 40, 30, .14); padding: 6px; z-index: 80;
  }
  .mega-models::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: -8px; width: 8px;
  }
  .mega-co:hover > .mega-models, .mega-co.open > .mega-models { display: block; }
  /* Paid column sits on the right — open outward left so it stays on-screen. */
  .dual-pick .pick-box:last-child .mega-models {
    left: auto; right: calc(100% + 6px);
  }
  .dual-pick .pick-box:last-child .mega-models::before {
    left: auto; right: -8px;
  }
  .mega-models button {
    width: 100%; text-align: left; border: 0; background: transparent;
    border-radius: 9px; padding: 9px 12px; font: inherit; cursor: pointer; color: var(--ink);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    white-space: nowrap;
  }
  .mega-models button:hover { background: #f3f3f3; }
  .mega-models button.on { background: var(--green-soft); color: var(--green); font-weight: 700; }
  .mega-models button.needs-key { color: var(--muted); font-weight: 500; }
  .mega-models button.needs-key span { opacity: .85; }
  .mega-models .pick-check {
    flex: 0 0 auto; font-size: 11px; font-weight: 700; color: var(--green);
  }
  @media (max-width: 800px) {
    .dual-pick { grid-template-columns: 1fr; }
    .mega-models {
      position: static; left: auto; right: auto; bottom: auto;
      width: auto; min-width: 0; max-width: none;
      box-shadow: none; border: 0; border-left: 2px solid var(--green-soft);
      padding: 4px 0 6px 10px; margin: 0 0 4px;
    }
    .mega-models::before { display: none; }
    .dual-pick .pick-box:last-child .mega-models { left: auto; right: auto; }
  }
  .stack-chips {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; min-height: 28px;
    align-items: center;
  }
  .stack-chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 8px 4px 10px; background: var(--white);
    font-size: 12px; line-height: 1.2; color: var(--ink);
  }
  .stack-chip b { font-weight: 600; }
  .stack-chip .n {
    flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%;
    background: var(--green-soft); color: var(--green);
    font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .stack-chip .badge { font-size: 10px; padding: 1px 6px; }
  .stack-chip button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 2px;
  }
  .stack-chip button:hover { color: var(--danger); }
  .stack-chip .empty { color: var(--muted); font-size: 12px; border: 0; padding: 0; background: transparent; }
  .key-slim {
    display: flex; flex-direction: column; gap: 10px;
  }
  .key-slim-row {
    display: grid; grid-template-columns: 120px 1fr auto; gap: 10px; align-items: center;
  }
  .key-slim-row .kl {
    font-size: 12px; font-weight: 700; color: #3d4a43;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .key-slim-row input {
    margin: 0; padding: 10px 12px; font-size: 13px;
  }
  .key-ready-line {
    margin: 8px 0 0; font-size: 12px; color: var(--muted);
  }
  @media (max-width: 640px) {
    .key-slim-row { grid-template-columns: 1fr; gap: 6px; }
  }
  .hid { display: none !important; }
  .studio { display: flex; flex-direction: column; gap: 14px; }
  .draft {
    border: 1px solid #e7e0d4; border-radius: 18px; overflow: hidden;
    background: linear-gradient(180deg, #fffdf8 0%, #f7f1e6 100%);
    color: var(--ink);
    box-shadow: 0 16px 40px rgba(60, 45, 20, .08);
  }
  .draft-top {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 14px 18px; border-bottom: 1px solid #ebe3d6;
    background: rgba(255,255,255,.75);
  }
  .draft-top strong { font-size: 14px; }
  .draft-top small { color: var(--muted); display: block; margin-top: 2px; }
  .draft-scroll {
    min-height: 380px; max-height: 64vh; overflow: auto;
    padding: 22px 22px 28px;
  }
  .prose-block { margin: 0 0 20px; max-width: 760px; }
  .prose-kicker {
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: var(--green); margin: 0 0 8px; text-transform: uppercase;
  }
  .prose-title {
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif;
    font-size: 28px; line-height: 1.35; margin: 0; font-weight: 600;
  }
  .prose-lead {
    font-size: 16px; line-height: 1.85; color: #3a3530; margin: 0;
  }
  .prose-body {
    font-size: 15.5px; line-height: 1.95; color: #2c2925; margin: 0 0 14px;
  }
  .prose-cta {
    display: inline-block; margin-top: 6px; padding: 10px 18px;
    border-radius: 999px; background: var(--green); color: #fff;
    font-weight: 700; font-size: 14px;
  }
  .caret {
    display: inline-block; width: 8px; height: 1.05em; margin-left: 2px;
    background: var(--green); vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .sec {
    border: 1px solid #ebe3d6; border-radius: 14px;
    padding: 14px 16px; margin: 0 0 12px; background: #fff;
  }
  .sec-group {
    margin: 18px 0 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--green);
  }
  .sec-group:first-child { margin-top: 0; }
  .sec-label {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--green); margin-bottom: 8px;
  }
  .sec-label .tag {
    background: var(--green-soft); color: var(--green);
    border-radius: 999px; padding: 2px 8px; font-size: 10px;
  }
  .sec-text { color: var(--ink); font-size: 14.5px; line-height: 1.8; white-space: pre-wrap; }
  .draft-foot {
    padding: 12px 18px; border-top: 1px solid #ebe3d6;
    display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px;
    background: rgba(255,255,255,.7);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 700;
    background: #efece6; color: var(--muted);
  }
  .pill.write { background: var(--green-soft); color: var(--green); }
  .pill.ok { background: var(--green-soft); color: var(--green); }
  .pill.fail { background: #f8e8e5; color: var(--danger); }
  .pill.wait { background: #efece6; color: var(--muted); }
  .writing-hint { color: var(--muted); font-size: 15px; line-height: 1.7; }
  .progress-panel {
    min-height: 200px; display: flex; flex-direction: column;
    align-items: stretch; justify-content: flex-start; gap: 14px; text-align: left;
    color: var(--muted); padding: 8px 2px 4px;
  }
  .progress-panel strong { color: var(--ink); font-size: 16px; }
  .run-progress {
    margin-top: 10px; padding: 14px 16px; border-radius: 14px;
    border: 1px solid var(--line); background: #fafbfa;
  }
  .run-progress-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin-bottom: 8px;
  }
  .run-progress-head .rp-title { font-size: 14px; font-weight: 700; color: var(--ink); margin: 0; }
  .run-progress-head .rp-pct {
    font-size: 22px; font-weight: 700; color: var(--green-deep);
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .run-progress-bar {
    height: 10px; border-radius: 999px; background: #e7ece9; overflow: hidden;
  }
  .run-progress-bar > i {
    display: block; height: 100%; width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #1a6b4a, #2f9e6f);
    transition: width .35s var(--ease);
  }
  .run-progress-meta {
    display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    margin-top: 8px; font-size: 12.5px;
  }
  .run-progress-meta .rp-stage { color: var(--ink); font-weight: 600; }
  .run-steps { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
  .run-steps li {
    display: flex; align-items: center; gap: 10px; font-size: 13px;
    padding: 6px 8px; border-radius: 10px;
  }
  .run-steps li .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto;
    background: #cfd6d2;
  }
  .run-steps li.done .dot { background: var(--green); }
  .run-steps li.active .dot {
    background: #1d5bb8;
    box-shadow: 0 0 0 3px rgba(29,91,184,.2);
  }
  .run-steps li.done { color: var(--green-deep); }
  .run-steps li.active { color: var(--ink); font-weight: 600; background: #f0f4fa; }
  .run-steps li.pending { color: var(--muted); }
  .run-steps li .rp-model { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid #ebe3d6; border-top-color: var(--green);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 800px) {
    .grid2 { grid-template-columns: 1fr; }
    main, header, .steps { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true">BBS</div>
    <div>
      <strong>BBS-CMS AI</strong>
      <small>Hearing CSV → Japanese homepage draft → WordPress sections → CSV</small>
    </div>
  </div>
</header>
<nav class="steps" id="stepper"></nav>
<main>
  <div id="view"><div class="card"><p class="lead">Loading…</p></div></div>
  <p class="msg" id="msg"></p>
</main>
<script src="config.js"></script>
<script>
(function () {
  var STEPS = [
    { id: "config", ja: "1 Config", en: "1 Config" },
    { id: "hearing", ja: "2 Hearing CSV", en: "2 Hearing CSV" },
    { id: "run", ja: "3 Draft", en: "3 Draft" },
    { id: "results", ja: "4 Sections", en: "4 Sections" },
    { id: "export", ja: "5 Download CSV", en: "5 Download CSV" }
  ];
  // WordPress steps intentionally disabled for BBS-CMS AI:
  // { id: "wp", ... }, { id: "finish", ... }

  var KEY_LABELS = {
    zai_api_key: "Z.AI",
    nvidia_api_key: "NVIDIA NIM",
    deepseek_api_key: "DeepSeek",
    openai_api_key: "OpenAI",
    anthropic_api_key: "Anthropic",
    gemini_api_key: "Gemini (Free)",
    gemini_paid_api_key: "Gemini (Paid)",
    moonshot_api_key: "Moonshot (Kimi)",
    minimax_api_key: "MiniMax",
    qwen_api_key: "Qwen (DashScope)"
  };

  var state = {
    step: "config",
    max: 0,
    config: null,
    hearing: null,
    hearingFile: "",
    hearingTable: null,
    selected: [],
    rows: [],
    runAt: "",
    running: false,
    showAdvanced: false,
    promptPage: "top",
    sectionsPage: "top",
    draftKeys: {},
    acceptedKeys: {},
    committedSelected: null,
    modelFilter: "all",
    modelQuery: "",
    lastError: "",
    console: {
      status: "idle", stage: "", text: "", sections: [], writer: "", meta: "",
      progress: null
    }
  };

  var PROVIDER_LABELS = {
    gemini: "Gemini",
    gemini_paid: "Gemini (Paid)",
    zai: "Z.AI",
    nvidia: "NVIDIA NIM",
    deepseek: "DeepSeek",
    openai: "OpenAI",
    anthropic: "Anthropic",
    moonshot: "Moonshot",
    minimax: "MiniMax",
    qwen: "Qwen"
  };

  function api(path) {
    var base = String(window.DEMO_API_BASE || "").replace(/\/$/, "");
    return base + path;
  }
  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function unescapeJsonString(s) {
    return String(s || "")
      .replace(/\\n/g, "\n")
      .replace(/\\"/g, '"')
      .replace(/\\\\/g, "\\")
      .replace(/\\u([0-9a-fA-F]{4})/g, function (_, h) {
        return String.fromCharCode(parseInt(h, 16));
      });
  }

  function extractJsonStringField(raw, key) {
    var re = new RegExp('"' + key + '"\\s*:\\s*"((?:\\\\.|[^"\\\\])*)"');
    var m = String(raw || "").match(re);
    if (m) return unescapeJsonString(m[1]);
    // Incomplete string still streaming
    var open = new RegExp('"' + key + '"\\s*:\\s*"((?:\\\\.|[^"\\\\])*)');
    var m2 = String(raw || "").match(open);
    return m2 ? unescapeJsonString(m2[1]) : "";
  }

  function extractLiveProse(raw) {
    var text = String(raw || "");
    // Strip markdown fences if model wraps JSON
    text = text.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/```\s*$/i, "");
    var prose = {
      title: "",
      heading: "",
      lead: "",
      body: [],
      cta: "",
      active: "heading"
    };
    try {
      var parsed = JSON.parse(text);
      prose.title = String(parsed.title || "");
      prose.heading = String(parsed.heading || "");
      prose.lead = String(parsed.lead || "");
      prose.body = Array.isArray(parsed.body_paragraphs) ? parsed.body_paragraphs.map(String) : [];
      prose.cta = String(parsed.cta || "");
      prose.active = "";
      return prose;
    } catch (e) {}
    prose.title = extractJsonStringField(text, "title");
    prose.heading = extractJsonStringField(text, "heading");
    prose.lead = extractJsonStringField(text, "lead");
    prose.cta = extractJsonStringField(text, "cta");
    var bodies = [];
    var arrMatch = text.match(/"body_paragraphs"\s*:\s*\[([\s\S]*)/);
    if (arrMatch) {
      var chunk = arrMatch[1];
      var re = /"((?:\\.|[^"\\])*)"/g;
      var m;
      while ((m = re.exec(chunk))) {
        bodies.push(unescapeJsonString(m[1]));
        if (chunk.slice(m.index + m[0].length).trim().indexOf("]") === 0) break;
      }
    }
    prose.body = bodies;
    if (prose.cta) prose.active = "cta";
    else if (bodies.length) prose.active = "body_" + bodies.length;
    else if (prose.lead) prose.active = "lead";
    else if (prose.heading) prose.active = "heading";
    else if (prose.title) prose.active = "title";
    else prose.active = "heading";
    return prose;
  }

  function renderLiveProseHtml(prose, writing) {
    if (!prose || (!prose.heading && !prose.lead && !prose.body.length && !prose.title && !prose.cta)) {
      return '<p class="writing-hint">原稿を書き始めています…<span class="caret"></span></p>';
    }
    var html = "";
    if (prose.heading || prose.title) {
      html += '<div class="prose-block"><div class="prose-kicker">見出し</div>' +
        '<p class="prose-title">' + esc(prose.heading || prose.title) +
        (writing && prose.active === "heading" ? '<span class="caret"></span>' : "") +
        "</p></div>";
    }
    if (prose.lead) {
      html += '<div class="prose-block"><div class="prose-kicker">リード</div>' +
        '<p class="prose-lead">' + esc(prose.lead) +
        (writing && prose.active === "lead" ? '<span class="caret"></span>' : "") +
        "</p></div>";
    }
    if (prose.body && prose.body.length) {
      html += '<div class="prose-block"><div class="prose-kicker">本文</div>';
      prose.body.forEach(function (p, idx) {
        var active = writing && prose.active === ("body_" + (idx + 1));
        html += '<p class="prose-body">' + esc(p) +
          (active ? '<span class="caret"></span>' : "") + "</p>";
      });
      html += "</div>";
    }
    if (prose.cta) {
      html += '<div class="prose-block"><div class="prose-kicker">CTA</div>' +
        '<span class="prose-cta">' + esc(prose.cta) +
        (writing && prose.active === "cta" ? '<span class="caret"></span>' : "") +
        "</span></div>";
    }
    return html || '<p class="writing-hint">原稿を整形しています…</p>';
  }

  function msg(text, ok) {
    var el = document.getElementById("msg");
    if (!el) return;
    el.className = "msg" + (ok === true ? " ok" : ok === false ? " err" : "");
    el.textContent = text || "";
  }
  function clearMsg() {
    msg("", null);
  }
  function pruneDraftKeysForSelection() {
    var needed = {};
    neededKeyFields(state.selected || []).forEach(function (k) {
      needed[k.field] = true;
    });
    Object.keys(state.draftKeys || {}).forEach(function (field) {
      if (!needed[field]) delete state.draftKeys[field];
    });
  }
  function go(step, max) {
    state.step = step;
    if (typeof max === "number") state.max = Math.max(state.max, max);
    draw();
  }

  function stepper() {
    document.getElementById("stepper").innerHTML = STEPS.map(function (s, i) {
      var disabled = i > state.max ? " disabled" : "";
      var on = state.step === s.id ? " on" : "";
      return '<button type="button" data-step="' + s.id + '"' + disabled + ' class="' + on.trim() + '">' + s.ja + "</button>";
    }).join("");
    document.querySelectorAll("[data-step]").forEach(function (b) {
      b.onclick = function () {
        if (b.disabled) return;
        var target = b.getAttribute("data-step");
        if (target !== "config") {
          var err = configGateError(state.selected, collectPastedKeys(), "nav");
          if (err) {
            msg(err, false);
            go("config", 0);
            return;
          }
          if (state.step === "config" && configIsDirty()) {
            msg("Press Save & continue to apply your Config changes.", false);
            return;
          }
        }
        state.step = target;
        draw();
      };
    });
  }

  async function loadConfig() {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 15000) : null;
    try {
      var res = await fetch(api("/v1/lab/config"), ctrl ? { signal: ctrl.signal } : undefined);
      if (!res.ok) throw new Error("HTTP " + res.status);
      state.config = await res.json();
      state.selected = (state.config.selected_models || []).slice();
      var san = sanitizeSelectedForKeys(state.selected);
      if (san.swaps.length) {
        state.selected = san.selected;
        state._lastKeySwapHint = san.swaps.map(function (s) {
          return modelLabel(s.from) + " → " + modelLabel(s.to);
        }).join("; ");
      }
      state.committedSelected = state.selected.slice();
      // Keys already on server (.env / lab) count as accepted.
      state.acceptedKeys = state.acceptedKeys || {};
      Object.keys(state.config.keys || {}).forEach(function (field) {
        if (state.config.keys[field] && state.config.keys[field].set) {
          state.acceptedKeys[field] = true;
        }
      });
      markAcceptedKeys(state.selected, {});
    } finally {
      if (timer) clearTimeout(timer);
    }
  }

  function neededKeyFields(selectedIds) {
    var cfg = state.config || { models: [], keys: {} };
    var byId = {};
    (cfg.models || []).forEach(function (m) { byId[m.id] = m; });
    var fields = [];
    var seen = {};
    (selectedIds || []).forEach(function (id) {
      var m = byId[id];
      if (!m || !m.key_field || seen[m.key_field]) return;
      seen[m.key_field] = true;
      fields.push({
        field: m.key_field,
        label: m.key_label || KEY_LABELS[m.key_field] || m.key_field,
        ready: !!(cfg.keys[m.key_field] && cfg.keys[m.key_field].set),
        meta: cfg.keys[m.key_field] || {},
        paid: false
      });
    });
    // Mark fields used by any paid selected model.
    (selectedIds || []).forEach(function (id) {
      var m = byId[id];
      if (!m || m.pricing !== "paid" || !m.key_field) return;
      fields.forEach(function (f) {
        if (f.field === m.key_field) f.paid = true;
      });
    });
    return fields;
  }

  function paidKeyFields(selectedIds) {
    return neededKeyFields(selectedIds).filter(function (k) { return k.paid; });
  }

  /** Merge saved draftKeys with current DOM password inputs. */
  function collectPastedKeys() {
    var keys = {};
    Object.keys(state.draftKeys || {}).forEach(function (f) {
      var v = String(state.draftKeys[f] || "").trim();
      if (v) keys[f] = v;
    });
    document.querySelectorAll("[data-key]").forEach(function (el) {
      var v = String(el.value || "").trim();
      var f = el.getAttribute("data-key");
      if (!f) return;
      if (v) keys[f] = v;
      else delete keys[f];
    });
    return keys;
  }

  /** Keys that still block progress.
   *  phase "config": need a paste OR an already-saved/.env key (ready).
   *  phase "nav": trust server-ready keys (Hearing / Draft / Run).
   *  Free and paid both accept ready keys — "free" means $0, not "no key".
   */
  function unresolvedKeyFields(selectedIds, pastedKeys, phase) {
    pastedKeys = pastedKeys || {};
    phase = phase || "config";
    return neededKeyFields(selectedIds).filter(function (k) {
      var pasted = String(pastedKeys[k.field] || "").trim();
      if (pasted) return false;
      if (k.ready) return false;
      if (phase === "config" && state.acceptedKeys && state.acceptedKeys[k.field]) {
        return false;
      }
      return true;
    });
  }

  /** Returns error string if gate fails; otherwise null.
   *  phase: "config" (Save) | "nav" (Hearing→Draft→Run)
   */
  function configGateError(selectedIds, pastedKeys, phase) {
    if (!(selectedIds || []).length) {
      return "Select at least one model to continue.";
    }
    var miss = unresolvedKeyFields(selectedIds, pastedKeys, phase || "config");
    if (miss.length) {
      var paidMiss = miss.filter(function (k) { return k.paid; });
      if (paidMiss.length) {
        return "Paid model selected — paste API key for: " +
          paidMiss.map(function (k) { return k.label; }).join(", ");
      }
      return "Free model still needs a free API key for: " +
        miss.map(function (k) { return k.label; }).join(", ") +
        ". Or pick GLM Flash / NIM (keys already in .env).";
    }
    return null;
  }

  function markAcceptedKeys(selectedIds, pastedKeys) {
    state.acceptedKeys = state.acceptedKeys || {};
    neededKeyFields(selectedIds).forEach(function (k) {
      var pasted = pastedKeys && String(pastedKeys[k.field] || "").trim();
      if (pasted || k.ready) state.acceptedKeys[k.field] = true;
    });
  }

  function configIsDirty() {
    var cur = (state.selected || []).slice();
    var saved = state.committedSelected;
    if (!saved) return cur.length > 0;
    if (cur.length !== saved.length) return true;
    for (var i = 0; i < cur.length; i++) {
      if (cur[i] !== saved[i]) return true;
    }
    return Object.keys(collectPastedKeys()).length > 0;
  }

  function refreshConfigGateUi() {
    var err = configGateError(state.selected, collectPastedKeys(), "config");
    var btn = document.getElementById("saveConfig");
    var bar = document.getElementById("configGateBar");
    var hint = document.getElementById("configGateHint");
    var title = document.getElementById("configGateTitle");
    if (btn) {
      btn.disabled = !!err;
      btn.title = err || "Save models and continue";
    }
    if (bar) {
      if (err) {
        bar.className = "gate-bar bad";
        bar.removeAttribute("aria-hidden");
      } else {
        bar.className = "gate-bar ok hid";
        bar.setAttribute("aria-hidden", "true");
      }
    }
    if (title) title.textContent = err ? "Cannot continue yet" : "";
    if (hint) hint.textContent = err || "";
    document.querySelectorAll("[data-key]").forEach(function (inp) {
      var field = inp.getAttribute("data-key");
      var meta = neededKeyFields(state.selected).filter(function (k) {
        return k.field === field;
      })[0];
      var has = !!String(inp.value || state.draftKeys[field] || "").trim();
      var accepted = !!(state.acceptedKeys && state.acceptedKeys[field]);
      var must = meta && meta.paid && !accepted && !has;
      var mustFree = meta && !meta.paid && !meta.ready && !has;
      if (must || mustFree) inp.classList.add("invalid");
      else inp.classList.remove("invalid");
    });
  }

  function roleLabel(selected, idx) {
    var n = (selected || []).length;
    if (n === 1) return "Writer";
    if (n === 2) return idx === 0 ? "Writer" : "Verifier";
    if (idx === 0) return "Writer";
    if (idx === 1) return "Improve";
    if (idx <= 4) return "Verifier";
    // n===1 already returned Writer above — no Verifier/Improve chips.
    return "Unused";
  }

  function roleBadgeClass(role) {
    var r = String(role || "").toLowerCase();
    if (r.indexOf("writer") === 0) return "role-writer";
    if (r.indexOf("improve") === 0) return "role-improve";
    if (r.indexOf("verifier") === 0) return "role-verifier";
    return "role-unused";
  }

  function roleBadgeHtml(role) {
    return '<span class="badge ' + roleBadgeClass(role) + '">' + esc(role) + "</span>";
  }

  function statusLabel(st) {
    var s = String(st || "").toLowerCase();
    if (s === "ok") return "used";
    if (s === "timeout") return "timed out";
    if (s === "error") return "failed";
    if (s === "skipped") return "skipped";
    return s || "—";
  }

  function skipReasonLabel(reason) {
    var r = String(reason || "");
    if (r === "gemini_self_verify_disabled") {
      return "skipped (Gemini self-verify off — uses ground filter only)";
    }
    return "skipped";
  }

  /** Runtime verify list — empty for 1-model (writer-only; ground still runs). */
  function runtimeVerifyIds(selected) {
    return (pipelinePreview(selected || []).verify) || [];
  }

  /**
   * Dynamic pipeline board from this run only.
   * Shows Writer / Improve / Verifier solely when that role was in the selection
   * and participated (or attempted) — never static demo rows.
   */
  function pipelineBoardHtml(row, fallbackSelected) {
    row = row || {};
    var roles = row.roles || (row.architecture && row.architecture.roles) || null;
    var selected = fallbackSelected || state.selected || [];
    var planned = pipelinePreview(selected);
    var lines = [];

    function push(badge, modelId, status, durationMs, reason) {
      if (!modelId) return;
      var st = String(status || "ok").toLowerCase();
      // Hide idle skips; show intentional skips with a real reason (no fake "used").
      if (st === "skipped" && !reason) return;
      var dur = "";
      if (typeof durationMs === "number" && durationMs >= 0 && st !== "skipped") {
        var sec = Math.round(durationMs / 100) / 10;
        dur = " · " + sec + "s";
      }
      var statusText = st === "skipped" ? skipReasonLabel(reason) : (statusLabel(st) + dur);
      lines.push(
        '<div class="pb-row">' + roleBadgeHtml(badge) +
        '<span class="pb-model">' + esc(modelLabel(modelId)) + "</span>" +
        '<span class="pb-status ' + esc(st) + '">' + esc(statusText) + "</span>" +
        "</div>"
      );
    }

    if (roles && (roles.writer || roles.improve || (roles.verifiers && roles.verifiers.length))) {
      // Prefer authoritative run result from the API.
      if (roles.writer && roles.writer.model) {
        push("Writer", roles.writer.model, roles.writer.status || "ok", roles.writer.duration_ms);
      }
      if (roles.improve && roles.improve.model) {
        push("Improve", roles.improve.model, roles.improve.status || "ok", roles.improve.duration_ms);
      }
      (roles.verifiers || []).forEach(function (v, i) {
        if (!v || !v.model) return;
        var label = (roles.verifiers.length > 1) ? ("Verifier #" + (i + 1)) : "Verifier";
        push(label, v.model, v.status || "ok", v.duration_ms, v.reason);
      });
    } else {
      // Fallback if older rows lack roles: only models that actually ran.
      var sw = row.stream_writer || row.model || "";
      var qw = row.quality_writer || "";
      var vs = row.verifiers || [];
      if (sw) push("Writer", sw, "ok", null);
      if (qw) push("Improve", qw, "ok", null);
      vs.forEach(function (id, i) {
        var label = (vs.length > 1) ? ("Verifier #" + (i + 1)) : "Verifier";
        push(label, id, "ok", null);
      });
      // Last resort: selection plan for this session (still dynamic, not hard-coded).
      if (!lines.length) {
        if (planned.writer) push("Writer", planned.writer, "ok", null);
        if (planned.polish) push("Improve", planned.polish, "ok", null);
        (planned.verify || []).forEach(function (id, i) {
          var label = (planned.verify.length > 1) ? ("Verifier #" + (i + 1)) : "Verifier";
          push(label, id, "ok", null);
        });
      }
    }

    if (!lines.length) return "";
    return '<div class="pipeline-board">' +
      '<p class="pb-title">Pipeline this run</p>' +
      lines.join("") +
      "</div>";
  }

  /** Live planned roles while a run is in progress (from current selection only). */
  function plannedPipelineBoardHtml(selected) {
    var planned = pipelinePreview(selected || []);
    var lines = [];
    function push(badge, id) {
      if (!id) return;
      lines.push(
        '<div class="pb-row">' + roleBadgeHtml(badge) +
        '<span class="pb-model">' + esc(modelLabel(id)) + "</span>" +
        '<span class="pb-status">running</span></div>'
      );
    }
    if (planned.writer) push("Writer", planned.writer);
    if (planned.polish) push("Improve", planned.polish);
    (runtimeVerifyIds(selected) || []).forEach(function (id, i) {
      var list = runtimeVerifyIds(selected);
      var label = (list.length > 1) ? ("Verifier #" + (i + 1)) : "Verifier";
      push(label, id);
    });
    if (!lines.length) return "";
    return '<div class="pipeline-board">' +
      '<p class="pb-title">Running pipeline</p>' +
      lines.join("") +
      "</div>";
  }

  /** Dynamic production steps from selection — drives % progress. */
  function buildRunSteps(selected, startEv) {
    var planned = pipelinePreview(selected || []);
    var writer = (startEv && startEv.writer) || planned.writer || "";
    var polish = (startEv && startEv.quality_writer) || planned.polish || "";
    var verifiers = (startEv && startEv.verifiers) || planned.verify || [];
    var steps = [];
    if (writer) {
      steps.push({
        id: "write",
        label: "Writer drafting",
        model: modelLabel(writer) || writer,
        weight: polish ? 40 : (verifiers.length ? 55 : 85)
      });
    }
    if (polish) {
      steps.push({
        id: "improve",
        label: "Improve polishing",
        model: modelLabel(polish) || polish,
        weight: 25
      });
    }
    if (verifiers.length) {
      steps.push({
        id: "verify",
        label: verifiers.length > 1 ? "Verifiers checking" : "Verifier checking",
        model: verifiers.map(function (id) { return modelLabel(id) || id; }).join(", "),
        weight: polish ? 25 : 30
      });
    }
    steps.push({ id: "ground", label: "Ground & seal", model: "", weight: 10 });
    // Normalize weights to 100
    var sum = steps.reduce(function (a, s) { return a + s.weight; }, 0) || 1;
    steps.forEach(function (s) { s.weight = Math.round((s.weight / sum) * 1000) / 10; });
    return steps;
  }

  function stageToStepId(stageId) {
    var id = String(stageId || "");
    if (id === "quality_swap") return "improve";
    if (id === "write" || id === "improve" || id === "verify" || id === "ground") return id;
    return id;
  }

  function initRunProgress(selected, startEv) {
    var steps = buildRunSteps(selected, startEv);
    var now = Date.now();
    state.console.progress = {
      steps: steps,
      stepId: steps[0] ? steps[0].id : "write",
      pct: 1,
      within: 0.02,
      tokenWithin: 0,
      label: steps[0] ? steps[0].label : "Starting",
      startedAt: now,
      stepStartedAt: now,
      tokenChars: 0,
      lastServerPct: 0
    };
  }

  /** Expected stage duration (sec) — refined live from token throughput. */
  function stageTauSec(prog) {
    var id = prog.stepId || "write";
    var base = { write: 70, improve: 55, verify: 30, ground: 5 }[id] || 40;
    if (id === "write" && prog.tokenChars > 120) {
      var elapsed = Math.max(1, (Date.now() - (prog.stepStartedAt || prog.startedAt)) / 1000);
      var cps = prog.tokenChars / elapsed;
      // Typical sealed JP draft JSON ~1.4k–2.2k chars
      var eta = 1800 / Math.max(cps, 0.15);
      base = Math.max(25, Math.min(120, eta * 0.55));
    }
    return base;
  }

  function refreshWithinFromReality(prog) {
    if (!prog || prog.stepId === "done") return;
    var tokenChars = Number(prog.tokenChars) || 0;
    var tokenWithin = Math.max(0, Math.min(0.88, Number(prog.tokenWithin) || 0));
    var serverWithin = 0;
    if (prog.lastServerPct && prog.steps && prog.steps.length) {
      var before = 0;
      var cur = 0;
      for (var i = 0; i < prog.steps.length; i++) {
        if (prog.steps[i].id === prog.stepId) {
          cur = prog.steps[i].weight;
          break;
        }
        before += prog.steps[i].weight;
      }
      if (cur > 0) {
        serverWithin = Math.max(0, Math.min(0.92, (prog.lastServerPct - before) / cur));
      }
    }
    // Writer / Verifier TTFB: do not invent % from wall-clock while zero tokens arrived.
    if ((prog.stepId === "write" || prog.stepId === "verify") && tokenChars <= 0) {
      prog.within = Math.min(Number(prog.within) || 0.04, 0.04);
      return;
    }
    // Improve: hold until stage completes (no stream yet).
    if (prog.stepId === "improve") {
      prog.within = Math.max(0.04, Math.min(Number(prog.within) || 0.04, 0.08));
      if (serverWithin > 0) prog.within = Math.max(prog.within, Math.min(0.08, serverWithin));
      return;
    }
    // Writer / Verifier with real tokens: fill from chars (+ server char-based pct).
    if (prog.stepId === "write" || prog.stepId === "verify") {
      prog.within = Math.max(prog.within || 0, tokenWithin, serverWithin);
      return;
    }
    // Ground / other: small honest hold until done.
    prog.within = Math.max(prog.within || 0.04, serverWithin);
  }

  function computeProgressPct(prog) {
    if (!prog || !prog.steps || !prog.steps.length) return 0;
    if (prog.stepId === "done") return 100;
    refreshWithinFromReality(prog);
    var steps = prog.steps;
    var idx = 0;
    for (var i = 0; i < steps.length; i++) {
      if (steps[i].id === prog.stepId) { idx = i; break; }
      idx = i;
    }
    var before = 0;
    for (var j = 0; j < idx; j++) before += steps[j].weight;
    var cur = steps[idx] ? steps[idx].weight : 0;
    var within = Math.max(0, Math.min(0.92, Number(prog.within) || 0));
    var pct = before + cur * within;
    return Math.max(1, Math.min(99, Math.round(pct)));
  }

  function setProgressStage(stageId, label) {
    var prog = state.console.progress;
    if (!prog || !prog.steps || !prog.steps.length) {
      initRunProgress(state.selected, null);
      prog = state.console.progress;
    }
    var sid = stageToStepId(stageId);
    var prev = prog.stepId;
    if (String(stageId) === "quality_swap") {
      prog.stepId = "improve";
      prog.within = Math.max(prog.within || 0, 0.95);
      prog.tokenWithin = Math.max(prog.tokenWithin || 0, 0.95);
      prog.label = label || "Improve complete";
    } else {
      var known = prog.steps.some(function (s) { return s.id === sid; });
      if (known) {
        if (sid !== prev) {
          prog.stepId = sid;
          prog.stepStartedAt = Date.now();
          prog.within = 0.04;
          prog.tokenWithin = 0;
          prog.tokenChars = sid === "write" ? prog.tokenChars : 0;
        }
        prog.label = label || (prog.steps.filter(function (s) { return s.id === sid; })[0] || {}).label || sid;
      }
    }
    prog.pct = computeProgressPct(prog);
    state.console.stage = prog.label;
  }

  function bumpWriteProgress(tokenText) {
    var prog = state.console.progress;
    if (!prog || prog.stepId !== "write") return;
    prog.tokenChars = (prog.tokenChars || 0) + String(tokenText || "").length;
    // Live estimate from output size (real chars, not a fixed demo curve).
    var target = Math.max(900, Math.min(2800, (prog.tokenChars < 400 ? 1600 : prog.tokenChars * 1.35)));
    prog.tokenWithin = Math.min(0.88, prog.tokenChars / target);
    prog.within = Math.max(prog.within || 0, prog.tokenWithin);
    prog.pct = computeProgressPct(prog);
    prog.label = "Writer drafting · " + prog.tokenChars + " chars";
    patchProgressUi();
  }

  function applyServerProgress(pct, chars, waitingFirst) {
    var prog = state.console.progress;
    if (!prog) return;
    var onStreamStage = prog.stepId === "write" || prog.stepId === "verify";
    // Ignore server % while still waiting for first output (label/elapsed only).
    if (waitingFirst || (onStreamStage && !(prog.tokenChars > 0) && !(chars > 0))) {
      if (typeof chars === "number" && chars > 0) {
        prog.tokenChars = chars;
      }
      prog.pct = computeProgressPct(prog);
      return;
    }
    if (typeof pct === "number") {
      prog.lastServerPct = Math.max(prog.lastServerPct || 0, Math.min(99, Math.round(pct)));
    }
    if (typeof chars === "number" && chars > (prog.tokenChars || 0)) {
      prog.tokenChars = chars;
      // Writer drafts are long; verifier JSON is compact — scale target by stage.
      var target = prog.stepId === "verify"
        ? Math.max(80, Math.min(500, chars < 40 ? 280 : chars * 1.25))
        : Math.max(900, Math.min(2800, chars < 400 ? 1600 : chars * 1.35));
      prog.tokenWithin = Math.min(0.88, chars / target);
    }
    prog.pct = computeProgressPct(prog);
  }

  function finishProgress() {
    var prog = state.console.progress;
    if (!prog) return;
    prog.stepId = "done";
    prog.within = 1;
    prog.pct = 100;
    prog.label = "Complete";
  }

  function formatElapsed(ms) {
    var s = Math.max(0, Math.floor((ms || 0) / 1000));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m ? (m + "m " + r + "s") : (r + "s");
  }

  function runProgressHtml() {
    var prog = (state.console && state.console.progress) || null;
    if (!prog || !prog.steps || !prog.steps.length) {
      initRunProgress(state.selected, null);
      prog = state.console.progress;
    }
    var pct = typeof prog.pct === "number" ? prog.pct : computeProgressPct(prog);
    prog.pct = pct;
    var elapsed = formatElapsed(Date.now() - (prog.startedAt || Date.now()));
    var stepId = prog.stepId;
    var reachedDone = stepId === "done";
    var stepsHtml = prog.steps.map(function (s) {
      var cls = "pending";
      if (reachedDone) cls = "done";
      else if (s.id === stepId) cls = "active";
      else {
        var ids = prog.steps.map(function (x) { return x.id; });
        if (ids.indexOf(s.id) < ids.indexOf(stepId)) cls = "done";
      }
      return '<li class="' + cls + '"><span class="dot" aria-hidden="true"></span>' +
        "<span>" + esc(s.label) + "</span>" +
        (s.model ? '<span class="rp-model">' + esc(s.model) + "</span>" : "") +
        "</li>";
    }).join("");
    // modelLabel for verifier list stored as joined names already sometimes
    return '<div class="run-progress" id="runProgress">' +
      '<div class="run-progress-head">' +
      '<p class="rp-title" id="runProgressTitle">' + esc(prog.label || "Running") + "</p>" +
      '<div class="rp-pct" id="runProgressPct">' + pct + "%</div>" +
      "</div>" +
      '<div class="run-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
      pct + '" aria-label="Pipeline progress"><i id="runProgressFill" style="width:' + pct + '%"></i></div>' +
      '<div class="run-progress-meta">' +
      '<span class="rp-stage" id="runProgressStage">' + esc(prog.label || "") + "</span>" +
      '<span id="runProgressElapsed">Elapsed ' + esc(elapsed) + "</span>" +
      "</div>" +
      '<ul class="run-steps" id="runProgressSteps">' + stepsHtml + "</ul>" +
      "</div>";
  }

  function patchProgressUi() {
    var prog = state.console && state.console.progress;
    if (!prog) return;
    var pct = computeProgressPct(prog);
    prog.pct = pct;
    var fill = document.getElementById("runProgressFill");
    var pctEl = document.getElementById("runProgressPct");
    var title = document.getElementById("runProgressTitle");
    var stage = document.getElementById("runProgressStage");
    var bar = document.querySelector(".run-progress-bar");
    var elapsedEl = document.getElementById("runProgressElapsed");
    if (fill) fill.style.width = pct + "%";
    if (pctEl) pctEl.textContent = pct + "%";
    if (title) title.textContent = prog.label || "Running";
    if (stage) stage.textContent = prog.label || "";
    if (bar) bar.setAttribute("aria-valuenow", String(pct));
    if (elapsedEl) elapsedEl.textContent = "Elapsed " + formatElapsed(Date.now() - (prog.startedAt || Date.now()));
    var list = document.getElementById("runProgressSteps");
    if (list && prog.steps) {
      var stepId = prog.stepId;
      var reachedDone = stepId === "done";
      var ids = prog.steps.map(function (x) { return x.id; });
      var curIdx = ids.indexOf(stepId);
      Array.prototype.forEach.call(list.children, function (li, i) {
        var cls = "pending";
        if (reachedDone || (curIdx >= 0 && i < curIdx)) cls = "done";
        else if (i === curIdx) cls = "active";
        li.className = cls;
      });
    }
  }

  function modelById(id) {
    var cfg = state.config || {};
    var found = null;
    (cfg.models || []).forEach(function (m) {
      if (m.id === id) found = m;
    });
    return found;
  }

  /** Display name only (id stays in option value / API). */
  function modelLabel(id) {
    var m = modelById(id) || {};
    return m.name || id || "";
  }

  function pipelinePreview(selected) {
    var s = selected || [];
    if (!s.length) {
      return { writer: "", polish: "", verify: [], unused: [], hint: "" };
    }
    if (s.length === 1) {
      return {
        writer: s[0], polish: "", verify: [], unused: [],
        hint: modelLabel(s[0]) + " writes the page (no Improve / Verifier)."
      };
    }
    if (s.length === 2) {
      return {
        writer: s[0], polish: "", verify: [s[1]], unused: [],
        hint: modelLabel(s[0]) + " writes · " + modelLabel(s[1]) + " verifies."
      };
    }
    var verify = s.slice(2, 5);
    var unused = s.slice(5);
    var hint = modelLabel(s[0]) + " writes · " + modelLabel(s[1]) + " improves · " +
      verify.map(modelLabel).join(", ") + (verify.length === 1 ? " verifies." : " verify.");
    if (unused.length) hint += " (extra models skipped)";
    return { writer: s[0], polish: s[1], verify: verify, unused: unused, hint: hint };
  }

  function providerLabel(m) {
    return PROVIDER_LABELS[m.provider] || m.key_label || m.provider || "";
  }

  /** Free = $0 list price, not "no API key". Gemini Flash still needs GEMINI_API_KEY. */
  function modelKeyReady(m) {
    if (!m) return false;
    if (m.key_configured) return true;
    var f = m.key_field;
    if (!f) return true;
    var cfg = state.config || { keys: {} };
    if (cfg.keys && cfg.keys[f] && cfg.keys[f].set) return true;
    if (String((state.draftKeys || {})[f] || "").trim()) return true;
    return false;
  }

  var FREE_KEY_FALLBACKS = [
    "glm-4.5-flash", "glm-4.7-flash", "nvidia-nemotron-super-49b",
    "nvidia-minimax-m3", "nvidia-deepseek-v4-flash", "nvidia-kimi-k3",
    "nvidia-nemotron-3-super-120b"
  ];

  function pickReadyFreeFallback(excludeIds) {
    var cfg = state.config || { models: [] };
    var byId = {};
    (cfg.models || []).forEach(function (m) { byId[m.id] = m; });
    excludeIds = excludeIds || [];
    var i, id, m;
    for (i = 0; i < FREE_KEY_FALLBACKS.length; i++) {
      id = FREE_KEY_FALLBACKS[i];
      if (excludeIds.indexOf(id) >= 0) continue;
      m = byId[id];
      if (m && modelKeyReady(m)) return id;
    }
    for (i = 0; i < (cfg.models || []).length; i++) {
      m = cfg.models[i];
      if (!m || excludeIds.indexOf(m.id) >= 0) continue;
      if (m.pricing === "paid") continue;
      if (modelKeyReady(m)) return m.id;
    }
    return null;
  }

  /** Replace free picks that lack a key with GLM/NIM that already have .env keys. */
  function sanitizeSelectedForKeys(selectedIds) {
    var cfg = state.config || { models: [] };
    var byId = {};
    (cfg.models || []).forEach(function (m) { byId[m.id] = m; });
    var next = [];
    var swaps = [];
    (selectedIds || []).forEach(function (id) {
      var m = byId[id];
      if (!m) return;
      if (modelKeyReady(m)) {
        if (next.indexOf(id) < 0) next.push(id);
        return;
      }
      // Paid without key: keep so the paste gate still asks for the paid key.
      if (m.pricing === "paid") {
        if (next.indexOf(id) < 0) next.push(id);
        return;
      }
      var fb = pickReadyFreeFallback(next);
      if (fb) {
        if (next.indexOf(fb) < 0) next.push(fb);
        swaps.push({ from: id, to: fb });
      }
    });
    return { selected: next, swaps: swaps };
  }

  function filteredModels(cfg) {
    var q = String(state.modelQuery || "").trim().toLowerCase();
    var filter = state.modelFilter || "all";
    return (cfg.models || []).filter(function (m) {
      var price = m.pricing === "free" ? "free" : "paid";
      if (filter === "free" && price !== "free") return false;
      if (filter === "paid" && price !== "paid") return false;
      if (!q) return true;
      var hay = [m.name, m.id, m.provider, providerLabel(m), price].join(" ").toLowerCase();
      return hay.indexOf(q) >= 0;
    }).slice().sort(function (a, b) {
      var ap = a.pricing === "free" ? 0 : 1;
      var bp = b.pricing === "free" ? 0 : 1;
      if (ap !== bp) return ap - bp;
      // Newest official GLMs first within paid/free groups.
      var ar = modelRank(a.id);
      var br = modelRank(b.id);
      if (ar !== br) return ar - br;
      return String(a.name || a.id).localeCompare(String(b.name || b.id));
    });
  }

  function modelRank(id) {
    var order = [
      "glm-5.3", "glm-5.2", "glm-5.1", "glm-5-turbo", "glm-5",
      "glm-4.7-flash", "glm-4.5-flash", "nvidia-nemotron-super-49b", "nvidia-minimax-m3",
      "kimi-k3", "minimax-m3"
    ];
    var i = order.indexOf(id);
    return i >= 0 ? i : 200;
  }

  var COMPANY_ORDER = [
    "gemini_paid", "gemini", "zai", "nvidia", "moonshot", "minimax", "qwen",
    "deepseek", "openai", "anthropic"
  ];

  function companiesFor(list) {
    var seen = {};
    (list || []).forEach(function (m) {
      if (m.provider) seen[m.provider] = true;
    });
    var keys = Object.keys(seen);
    keys.sort(function (a, b) {
      var ai = COMPANY_ORDER.indexOf(a);
      var bi = COMPANY_ORDER.indexOf(b);
      if (ai < 0) ai = 99;
      if (bi < 0) bi = 99;
      if (ai !== bi) return ai - bi;
      return (PROVIDER_LABELS[a] || a).localeCompare(PROVIDER_LABELS[b] || b);
    });
    return keys;
  }

  function viewConfig() {
    var cfg = state.config || { keys: {}, models: [], system_prompt: "", user_prompt_template: "" };
    var san = sanitizeSelectedForKeys(state.selected || []);
    if (san.swaps.length) {
      state.selected = san.selected;
      state._lastKeySwapHint = san.swaps.map(function (s) {
        return modelLabel(s.from) + " → " + modelLabel(s.to);
      }).join("; ");
    }
    var selected = state.selected || [];
    var byId = {};
    (cfg.models || []).forEach(function (m) { byId[m.id] = m; });
    var needed = neededKeyFields(selected);
    // Paid still needs paste; free without a key is remapped above (no Gemini paste gate).

    var prevFilter = state.modelFilter;

    var freeList = filteredModels(cfg);
    state.modelFilter = "paid";
    var paidList = filteredModels(cfg);

    var stack = selected.length
      ? '<div class="stack-chips">' + selected.map(function (id, idx) {
          var m = byId[id] || { id: id };
          var price = m.pricing === "paid" ? "paid" : "free";
          var role = roleLabel(selected, idx);
          return '<span class="stack-chip">' +
            '<span class="n">' + (idx + 1) + "</span>" +
            "<b>" + esc(m.name || id) + "</b>" +
            roleBadgeHtml(role) +
            '<span class="badge ' + price + '">' + price + "</span>" +

      : '<div class="stack-chips"><span class="empty">None selected — pick from Free or Paid</span></div>';

    function keyRowHtml(k) {
      var draft = state.draftKeys[k.field] || "";
      var modelsForKey = (selected || []).filter(function (id) {
        var m = byId[id];
        return m && m.key_field === k.field;
      }).map(function (id) { return (byId[id] && byId[id].name) || id; });
      var forModels = modelsForKey.length ? modelsForKey.slice(0, 2).join(", ") : "";
      var ph = "Paste " + (k.label || "provider") + " API key only";
      var badge = k.paid
        ? '<span class="badge req">paid key</span>'
        : '<span class="badge req">free key needed</span>';
      var hint = k.paid
        ? "Paid provider key"

      return '<div class="key-slim-row" style="grid-template-columns:140px 1fr auto;align-items:start">' +
        '<div><span class="kl">' + esc(k.label) + (k.paid ? " *" : "") + "</span>" +
        (forModels ? '<div class="key-hint">For: ' + esc(forModels) + "</div>" : "") +
        '<div class="key-hint">' + esc(hint) + "</div></div>" +
        '<input type="password" data-key="' + esc(k.field) + '"' +
        (k.paid ? ' data-paid="1"' : "") +
        ' aria-required="true" placeholder="' + esc(ph) + '" autocomplete="off" value="' +
        esc(draft) + '">' +
        badge +
        "</div>";

    var keyRows = needPaste.map(keyRowHtml).join("");
    var gateErr = configGateError(selected, Object.assign({}, state.draftKeys), "config");

    return '<div class="card"><h2>Config</h2>' +
      '<p class="lead">How many models you pick decides the jobs:</p>' +
      '<div class="picker-notes">' +
      '<div><b>1 model</b> — <span class="t-writer">#1</span> is <b>Writer</b> only (no Improve / Verifier; ground filter still runs).</div>' +
      '<div><b>2 models</b> — <span class="t-writer">#1</span> is <b>Writer</b>, <span class="t-verifier">#2</span> is <b>Verifier</b>.</div>' +
      '<div><b>3+ models</b> — <span class="t-writer">#1</span> <b>Writer</b>, <span class="t-improve">#2</span> <b>Improve</b> (polishes the draft), <span class="t-verifier">#3–5</span> <b>Verifier</b>.</div>' +
      "</div>" +
      '<div class="dual-pick">' +
      hoverMenuHtml("free", freeList, selected) +
      hoverMenuHtml("paid", paidList, selected) +
      "</div>" +
      '<label style="margin-top:14px">Selected models</label>' +
      '<div id="selectedChips">' + stack + "</div>" +
      (keyRows
        ? '<div class="cred-panel"><h3>API credentials</h3>' +
          '<div class="key-slim" id="keyInputs">' + keyRows + "</div></div>"
        : "") +
      (state._lastKeySwapHint
        ? '<div class="gate-bar ok" id="configSwapBar">' +
          '<div><p class="gate-title">Using ready free models</p>' +
          '<p class="gate-hint">' + esc(state._lastKeySwapHint) +
          " — Gemini Flash is free to call but still needs GEMINI_API_KEY. " +
          "GLM/NIM keys are already in .env.</p></div></div>"
        : "") +
      (gateErr
        ? '<div class="gate-bar bad" id="configGateBar">' +
          '<div><p class="gate-title" id="configGateTitle">Cannot continue yet</p>' +
          '<p class="gate-hint" id="configGateHint">' + esc(gateErr) + "</p></div></div>"
        : '<div class="gate-bar ok hid" id="configGateBar" aria-hidden="true">' +
          '<div><p class="gate-title" id="configGateTitle"></p>' +
          '<p class="gate-hint" id="configGateHint"></p></div></div>') +
      '<details style="margin-top:16px"' + (state.showAdvanced ? " open" : "") + ">" +
      '<summary style="cursor:pointer;font-weight:700">Advanced: prompts</summary>' +
      "<label>System prompt</label><textarea id=\"systemPrompt\">" + esc(cfg.system_prompt) + "</textarea>" +
      "<label>User prompt template (use {hearing})</label><textarea id=\"userPrompt\">" + esc(cfg.user_prompt_template) + "</textarea>" +
      '<p class="prompt-note" style="margin-top:16px">Draft writes <b>all header pages</b> from the hearing (TOP, concept, service, greeting, menu, faq, feature, access, reviews — plus blog/column listing shells). Dynamic blog/feature sub-pages are not generated. Tabs below are for viewing checklists only.</p>' +
      '<div class="prompt-tabs" id="promptTabs">' +
      (promptSectionsCatalog().tabs || []).map(function (t) {
        return '<button type="button" data-prompt-page="' + esc(t.id) + '"' +
          (state.promptPage === t.id ? ' class="on"' : "") + ">" + esc(t.label || t.id) +
          (t.shell ? ' <span class="key-hint">(shell)</span>' : "") +
          "</button>";
      }).join("") +
      "</div>" +
      '<div id="promptSectionItems">' + promptSectionItemsHtml(state.promptPage) + "</div>" +
      "</details>" +
      '<div class="actions">' +
      '<button class="btn g" id="saveConfig"' + (gateErr ? " disabled" : "") +
      ' title="' + esc(gateErr || "Save models and continue") +
      '">Save &amp; continue</button></div></div>';
  }

  function viewHearing() {

      '<div class="cell"><div class="k">Area</div><div class="v">' + esc(h.area || "—") + "</div></div>" +

  function viewRun() {
    var selected = state.selected || [];
    var pipe = pipelinePreview(selected);
    var h = state.hearing || {};
    var hasSections = !!(state.console.sections || []).length || !!(state.rows || []).length;
    var canRun = !state.running && !!state.hearing && selected.length > 0;

    var roleRows = "";
    function roleModelCell(id) {
      var m = modelById(id) || {};
      var prov = PROVIDER_LABELS[m.provider] || m.key_label || m.provider || "";
      return "<b>" + esc(modelLabel(id)) + "</b>" +
        (prov ? ' <span class="key-hint">via ' + esc(prov) + "</span>" : "");

    // Dynamic from selection only — same rules as the live pipeline.
    if (pipe.writer) {
      roleRows += "<tr><td class=\"role-td\">" + roleBadgeHtml("Writer") + "</td><td>" +
        roleModelCell(pipe.writer) + "</td></tr>";
    }
    if (pipe.polish) {
      roleRows += "<tr><td class=\"role-td\">" + roleBadgeHtml("Improve") + "</td><td>" +
        roleModelCell(pipe.polish) + "</td></tr>";

      var label = (pipe.verify.length > 1) ? ("Verifier #" + (i + 1)) : "Verifier";
      roleRows += "<tr><td class=\"role-td\">" + roleBadgeHtml(label) + "</td><td>" +

    return '<div class="card"><h2>Draft</h2>' +

        ? '<p class="msg err">No hearing loaded — go back to Hearing CSV.</p>'
        : "<p><b>Shop:</b> " + esc(h.business_name || "—") +
          (h.area ? " · <b>Area:</b> " + esc(h.area) : "") +
          (state.hearingFile ? " · <b>File:</b> " + esc(state.hearingFile) : "") + "</p>") +
      (selected.length
        ? '<table style="margin-top:8px"><thead><tr><th>Role</th><th>Model</th></tr></thead><tbody>' +
          roleRows + "</tbody></table>"
        : '<p class="msg err">No models selected — go back to Config.</p>') +
      '<div class="actions" style="margin-top:16px">' +
      '<button class="btn g" id="runLab"' + (canRun ? "" : " disabled") + ">" +
      (state.running ? "Creating…" : "Start draft") + "</button>" +
      (hasSections && !state.running
        ? '<button class="btn" id="toResults">View sections</button>'
        : "") +
      '<button class="btn" id="toHearing">Back: Hearing</button>' +
      "</div></div>";
