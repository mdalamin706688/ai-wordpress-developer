  function filterSectionsForTab(sections, page) {
    var tab = page || "top";
    var wpMap = {
      top: "home",
      home: "home",
      concept: "concept",
      service: "service",
      greeting: "greeting",
      menu: "menu",
      faq: "faq",
      feature: "feature",
      access: "access",
      blog: "blog",
      column: "column",
      reviews: "reviews",
      contact: "contact"
    };
    var want = wpMap[tab] || tab;
    return (sections || []).filter(function (s) {
      var id = String(s.id || "");
      var wp = s.wp_page || "home";
      if (wp === want) return true;
      // Prefix match for checklist ids like top_hero / concept_points
      if (tab === "top" || tab === "home") {
        return id.indexOf("top_") === 0 || id.indexOf("home_") === 0;
      }
      return id.indexOf(tab + "_") === 0;
    });
  }

  function headerSectionTabs() {
    var catalog = promptSectionsCatalog();
    var tabs = (catalog.tabs || []).map(function (t) {
      return { id: t.id, label: t.label || t.id, shell: !!t.shell };
    });
    tabs.push({ id: "contact", label: "Contact", shell: true });
    return tabs;
  }

  function renderSectionsHtml(sections) {
    var lastPage = "";
    var pageTitles = {
      home: "TOP sections",
      concept: "Concept page",
      service: "Service sections",
      greeting: "Greeting page",
      menu: "Menu page",
      faq: "FAQ page",
      feature: "Feature page",
      access: "Access page",
      blog: "Blog listing",
      column: "Column listing",
      reviews: "Reviews page",
      contact: "Contact page"
    };
    return (sections || []).map(function (s) {
      var page = s.wp_page || "home";
      var head = "";
      if (page !== lastPage) {
        lastPage = page;
        head = '<div class="sec-group">' + esc(pageTitles[page] || page) + "</div>";
      }
      return head + '<div class="sec">' +
        '<div class="sec-label"><span class="tag">' + esc(s.id) + "</span>" +
        esc(s.label_ja || "") + " / " + esc(s.label_en || "") +
        " · WP:" + esc(page) + "</div>" +
        '<div class="sec-text">' + esc(s.text || "") + "</div></div>";
    }).join("");
  }

  function viewResults() {
    var selected = state.selected || [];
    var row = (state.rows || [])[0];
    var c = state.console || {};
    var sections = c.sections || [];
    if ((!sections.length || isLegacyWpSections(sections)) && row) {
      sections = normalizeRowSections(row);
      if (sections.length) {
        state.console.sections = sections;
        c.sections = sections;
      }
    }
    if (!sections.length && row) sections = (row.sections || []);
    var failed = c.status === "fail" || (row && row.ok === false);
    var errText = state.lastError || c.stage || (row && row.error) || "Writing failed";
    var waiting = !sections.length && !failed && (state.running || c.status === "write" || c.status === "verify");

    if (waiting) {
      return '<div class="card"><h2>WordPress sections</h2>' +
        '<p class="lead">Production pipeline running — live progress below.</p>' +
        runProgressHtml() +
        "</div>";
    }

    if (failed && !sections.length) {
      return '<div class="card"><h2>WordPress sections</h2>' +
        '<p class="lead">生成に失敗しました。キー・課金・モデル権限を確認してください。</p>' +
        '<div class="progress-panel" style="min-height:160px">' +
        '<strong style="color:var(--danger)">Failed</strong>' +
        '<p style="white-space:pre-wrap;line-height:1.5">' + esc(errText) + "</p>" +
        '<p class="key-hint">Free options: Gemini Flash, GLM-4.5/4.7 Flash (Z.AI), MiniMax M3 (NIM), Nemotron Super 49B (NIM).</p>' +
        "</div>" +
        '<div class="actions">' +
        '<button class="btn" id="toConfig">Back to Config</button>' +
        '<button class="btn g" id="runLab"' +
        (!state.hearing || !selected.length ? " disabled" : "") +
        ">Retry draft</button>" +
        "</div></div>";
    }

    if (!sections.length) {
      return '<div class="card"><h2>WordPress sections</h2>' +
        '<p class="lead">Open Draft and press Start draft. Finished sections appear here.</p>' +
        '<div class="actions"><button class="btn g" id="runLab"' +
        (!state.hearing || !selected.length ? " disabled" : "") +
        ">原稿作成を開始</button></div></div>";
    }

    var metaLine = row
      ? "<p>Known facts " + esc(row.facts || "") + " · " + esc(row.speed_sec) +
        "s · complete=" + (row.complete ? "yes" : "no") + "</p>"
      : "";
    var board = pipelineBoardHtml(row, selected);
    var tabs = headerSectionTabs();
    var tab = state.sectionsPage || "top";
    var known = {};
    tabs.forEach(function (t) { known[t.id] = true; });
    if (!known[tab]) tab = "top";
    var shown = filterSectionsForTab(sections, tab);
    var counts = {};
    tabs.forEach(function (t) {
      counts[t.id] = filterSectionsForTab(sections, t.id).length;
    });
    var activeMeta = null;
    for (var ti = 0; ti < tabs.length; ti++) {
      if (tabs[ti].id === tab) { activeMeta = tabs[ti]; break; }
    }
    var tabTitle = (activeMeta && activeMeta.label) ? activeMeta.label + " ページ" : tab;
    var tabHint = "Static header page sections for WordPress drafts (no dynamic blog/feature sub-pages)";

    return '<div class="card"><h2>WordPress sections</h2>' +
      '<p class="lead">完成した WordPress セクションです。ヘッダー各ページをタブで切り替え（ブログ個別記事は対象外）。</p>' +
      board +
      metaLine +
      '<div class="actions">' +
      '<button class="btn" id="runLab"' +
      (!state.hearing || !selected.length ? " disabled" : "") + ">再生成</button>" +
      '<button class="btn g" id="toExport">Next: Download CSV</button>' +
      "</div></div>" +
      '<div class="draft" id="draftConsole">' +
      '<div class="draft-top"><div><strong>' + esc(tabTitle) + "</strong>" +
      "<small>" + esc(tabHint) + "</small></div>" +
      '<span class="pill ok">完成</span></div>' +
      '<div class="prompt-tabs" id="sectionsTabs" style="padding:10px 18px 0;flex-wrap:wrap">' +
      tabs.map(function (t) {
        return '<button type="button" data-sections-page="' + esc(t.id) + '"' +
          (tab === t.id ? ' class="on"' : "") + ">" + esc(t.label) +
          ' <span class="key-hint">(' + (counts[t.id] || 0) + ")</span></button>";
      }).join("") +
      "</div>" +
      '<div class="draft-scroll" id="draftScroll">' +
      (shown.length
        ? renderSectionsHtml(shown)
        : '<p class="lead" style="padding:8px 0">No sections in this tab yet. Press 再生成.</p>') +
      "</div>" +
      '<div class="draft-foot" id="draftFoot"><span>セクション完成 · ' +
      esc(tab) + " · " + sections.length + " total</span></div>" +
      "</div>";
  }

  function viewExport() {
    var sections = ((state.rows || [])[0] && (state.rows || [])[0].sections) || state.console.sections || [];
    var n = sections.length;
    return '<div class="card"><h2>Download CSV</h2>' +
      '<p class="lead">WordPress-only CSV: field · label · wp_page · content</p>' +
      "<p>Sections ready: <b>" + n + "</b></p>" +
      '<div class="actions">' +
      '<button class="btn" id="toResults">Back to Sections</button>' +
      '<button class="btn g" id="downloadCsv"' + (n ? "" : " disabled") + ">Download CSV</button>" +
      '</div></div>';
  }

  function draw() {
    stepper();
    document.getElementById("view").innerHTML = {
      config: viewConfig,
      hearing: viewHearing,
      run: viewRun,
      results: viewResults,
      export: viewExport
    }[state.step]();

    var save = document.getElementById("saveConfig");
    if (save) save.onclick = saveConfig;
    var promptTabs = document.getElementById("promptTabs");
    if (promptTabs) {
      promptTabs.querySelectorAll("[data-prompt-page]").forEach(function (btn) {
        btn.onclick = function () {
          state.promptPage = btn.getAttribute("data-prompt-page") || "top";
          state.showAdvanced = true;
          draw();
        };
      });
    }
    var sectionsTabs = document.getElementById("sectionsTabs");
    if (sectionsTabs) {
      sectionsTabs.querySelectorAll("[data-sections-page]").forEach(function (btn) {
        btn.onclick = function () {
          state.sectionsPage = btn.getAttribute("data-sections-page") || "top";
          draw();
        };
      });
    }
    var adv = document.querySelector("details summary");
    if (adv && adv.parentElement) {
      adv.parentElement.addEventListener("toggle", function (ev) {
        state.showAdvanced = !!(ev.target && ev.target.open);
      });
    }
    var toHearing = document.getElementById("toHearing");
    if (toHearing) {
      toHearing.onclick = function () {
        // Back navigation only (Draft → Hearing). Config no longer has a bypass Next.
        go("hearing", 1);
      };
    }
    var toRun = document.getElementById("toRun");
    if (toRun) {
      toRun.onclick = function () {
        var err = configGateError(state.selected, collectPastedKeys(), "nav");
        if (err) { msg(err, false); go("config", 0); return; }
        if (!state.hearing) { msg("Upload a hearing CSV first.", false); go("hearing", 1); return; }
        go("run", 2);
      };
    }
    var toResults = document.getElementById("toResults");
    if (toResults) toResults.onclick = function () { go("results", 3); };
    var toExport = document.getElementById("toExport");
    if (toExport) toExport.onclick = function () { go("export", 4); };
    var toConfig = document.getElementById("toConfig");
    if (toConfig) toConfig.onclick = function () { go("config", 0); };
    var run = document.getElementById("runLab");
    if (run) run.onclick = runLab;
    var up = document.getElementById("hearingUp");
    if (up) up.onchange = function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) uploadHearing(f).catch(function (err) { msg(err.message || "Upload failed", false); });
      e.target.value = "";
    };
    var sample = document.getElementById("sampleDl");
    if (sample) sample.onclick = function () {
      window.location.href = api("/v1/demo/hearing-sheet.csv");
    };
    var addBtn = document.getElementById("toggleModel") || document.getElementById("addModel");
    if (addBtn) addBtn.onclick = toggleModelFromSelect;
    document.querySelectorAll("[data-mega-trigger]").forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var kind = btn.getAttribute("data-mega-trigger");
        var dd = document.getElementById(kind + "MegaDd");
        document.querySelectorAll(".mega-dd.open").forEach(function (el) {
          if (el !== dd) el.classList.remove("open");
        });
        if (dd) dd.classList.toggle("open");
      };
    });
    document.querySelectorAll("[data-company-toggle]").forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var row = btn.closest(".mega-co");
        if (!row) return;
        clearTimeout(row.__megaLeaveTimer);
        var panel = row.parentElement;
        if (panel) {
          panel.querySelectorAll(".mega-co.open").forEach(function (el) {
            if (el !== row) {
              clearTimeout(el.__megaLeaveTimer);
              el.classList.remove("open");
            }
          });
        }
        row.classList.toggle("open");
      };
    });
    // Sticky nested open: delay close so slow moves into the flyout do not snap shut.
    document.querySelectorAll(".mega-co").forEach(function (row) {
      row.onmouseenter = function () {
        clearTimeout(row.__megaLeaveTimer);
        var panel = row.parentElement;
        if (panel) {
          panel.querySelectorAll(".mega-co.open").forEach(function (el) {
            if (el !== row) {
              clearTimeout(el.__megaLeaveTimer);
              el.classList.remove("open");
            }
          });
        }
        row.classList.add("open");
      };
      row.onmouseleave = function () {
        clearTimeout(row.__megaLeaveTimer);
        row.__megaLeaveTimer = setTimeout(function () {
          row.classList.remove("open");
        }, 280);
      };
    });
    document.querySelectorAll("[data-pick-model]").forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        toggleModel(btn.getAttribute("data-pick-model"));
      };
    });
    if (!window.__megaCloseBound) {
      window.__megaCloseBound = true;
      document.addEventListener("click", function () {
        document.querySelectorAll(".mega-dd.open").forEach(function (el) {
          el.classList.remove("open");
        });
        document.querySelectorAll(".mega-co.open").forEach(function (el) {
          clearTimeout(el.__megaLeaveTimer);
          el.classList.remove("open");
        });
      });
    }
    document.querySelectorAll(".mega-panel").forEach(function (panel) {
      panel.onclick = function (e) { e.stopPropagation(); };
    });
    document.querySelectorAll("[data-remove]").forEach(function (b) {
      b.onclick = function () { removeModel(b.getAttribute("data-remove")); };
    });
    document.querySelectorAll("[data-key]").forEach(function (inp) {
      inp.oninput = function () {
        state.draftKeys[inp.getAttribute("data-key")] = inp.value;
        clearMsg();
        refreshConfigGateUi();
      };
    });
    var drop = document.getElementById("hearingDrop");
    if (drop) {
      ["dragenter", "dragover"].forEach(function (ev) {
        drop.addEventListener(ev, function (e) {
          e.preventDefault(); e.stopPropagation();
          drop.classList.add("drag");
        });
      });
      ["dragleave", "drop"].forEach(function (ev) {
        drop.addEventListener(ev, function (e) {
          e.preventDefault(); e.stopPropagation();
          drop.classList.remove("drag");
        });
      });
      drop.addEventListener("drop", function (e) {
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) uploadHearing(f).catch(function (err) { msg(err.message || "Upload failed", false); });
      });
    }
    if (document.getElementById("saveConfig")) refreshConfigGateUi();
    var csv = document.getElementById("downloadCsv");
    if (csv) csv.onclick = downloadCsv;
  }

  function selectedModelsFromDom() {
    return (state.selected || []).slice();
  }

  function preserveDraftKeys() {
    document.querySelectorAll("[data-key]").forEach(function (inp) {
      state.draftKeys[inp.getAttribute("data-key")] = inp.value;
    });
  }

  function addModelFromSelect() {
    toggleModelFromSelect();
  }

  function toggleModel(id) {
    if (!id) return;
    preserveDraftKeys();
    var idx = state.selected.indexOf(id);
    if (idx >= 0) {
      state.selected.splice(idx, 1);
      state._lastKeySwapHint = "";
      pruneDraftKeysForSelection();
      clearMsg();
      draw();
      return;
    }
    var cfg = state.config || { models: [] };
    var byId = {};
    (cfg.models || []).forEach(function (m) { byId[m.id] = m; });
    var m = byId[id];
    // Free model with no key (typical: Gemini) → use GLM/NIM that already has .env keys.
    if (m && m.pricing !== "paid" && !modelKeyReady(m)) {
      var fb = pickReadyFreeFallback(state.selected);
      if (!fb) {
        msg("No free model with an API key is ready. Add GEMINI_API_KEY or check .env.", false);
        return;
      }
      if (state.selected.indexOf(fb) < 0) state.selected.push(fb);
      state._lastKeySwapHint = modelLabel(id) + " → " + modelLabel(fb);
      pruneDraftKeysForSelection();
      msg(
        modelLabel(id) + " needs a free API key. Using " + modelLabel(fb) +
          " instead (key already in .env). Paste GEMINI_API_KEY to use Gemini.",
        true
      );
      draw();
      return;
    }
    state.selected.push(id);
    state._lastKeySwapHint = "";
    pruneDraftKeysForSelection();
    clearMsg();
    draw();
  }

  function toggleModelFromSelect() {
    var sel = document.getElementById("modelSelect");
    if (!sel || !sel.value) return;
    toggleModel(sel.value);
  }

  function removeModel(id) {
    preserveDraftKeys();
    state.selected = (state.selected || []).filter(function (x) { return x !== id; });
    pruneDraftKeysForSelection();
    clearMsg();
    draw();
  }

  async function saveConfig() {
    var saveBtn = document.getElementById("saveConfig");
    var prevLabel = saveBtn ? saveBtn.textContent : "";
    try {
      preserveDraftKeys();
      var keys = collectPastedKeys();
      var san = sanitizeSelectedForKeys(selectedModelsFromDom());
      state.selected = san.selected;
      if (san.swaps.length) {
        state._lastKeySwapHint = san.swaps.map(function (s) {
          return modelLabel(s.from) + " → " + modelLabel(s.to);
        }).join("; ");
      }
      var gate = configGateError(state.selected, keys, "config");
      if (gate) {
        refreshConfigGateUi();
        var firstBad = document.querySelector("[data-key].invalid");
        if (firstBad) firstBad.focus();
        throw new Error(gate);
      }
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = Object.keys(keys).length ? "Checking key…" : "Saving…";
      }
      var sysEl = document.getElementById("systemPrompt");
      var userEl = document.getElementById("userPrompt");
      var body = {
        keys: keys,
        selected_models: state.selected,
        system_prompt: sysEl ? sysEl.value : ((state.config && state.config.system_prompt) || ""),
        user_prompt_template: userEl ? userEl.value : ((state.config && state.config.user_prompt_template) || "")
      };
      var res = await fetch(api("/v1/lab/config"), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        var errBody = {};
        try { errBody = await res.json(); } catch (e) {}
        var detail = errBody.detail;
        if (Array.isArray(detail)) {
          detail = detail.map(function (x) {
            return typeof x === "string" ? x : (x && x.msg) || JSON.stringify(x);
          }).join(" ");
        } else if (detail && typeof detail === "object") {
          detail = JSON.stringify(detail);
        }
        throw new Error(detail || ("HTTP " + res.status));
      }
      state.config = await res.json();
      state.selected = (state.config.selected_models || []).slice();
      state.committedSelected = state.selected.slice();
      markAcceptedKeys(state.selected, keys);
      // Clear pasted drafts for keys that are now saved server-side.
      Object.keys(keys).forEach(function (f) {
        if (state.config.keys && state.config.keys[f] && state.config.keys[f].set) {
          delete state.draftKeys[f];
        }
      });
      go("hearing", 1);
      msg("Config saved. Continue with Hearing CSV.", true);
    } catch (e) {
      msg(e.message || "Save failed", false);
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.textContent = prevLabel || "Save & continue";
        refreshConfigGateUi();
      }
    }
  }

  async function readUploadText(file) {
    var buf = await file.arrayBuffer();
    var bytes = new Uint8Array(buf);
    if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
      return new TextDecoder("utf-8").decode(bytes.subarray(3));
    }
    return new TextDecoder("utf-8").decode(bytes).replace(/^\uFEFF/, "");
  }

  async function uploadHearing(file) {
    var text = await readUploadText(file);
    var body = /\.json$/i.test(file.name) ? { json: JSON.parse(text) } : { csv: text };
    if (body.json && body.json.hearing) body.json = body.json.hearing;
    var res = await fetch(api("/v1/demo/hearing/parse"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      var err = {};
      try { err = await res.json(); } catch (e) {}
      throw new Error(err.detail || ("HTTP " + res.status));
    }
    var data = await res.json();
    state.hearing = data.hearing;
    state.hearingFile = file.name;
    state.hearingTable = data.table || (data.meta && data.meta.table);
    state.rows = [];
    go("hearing", 1);
    msg("Hearing loaded: " + (data.hearing.business_name || ""), true);
  }

  var progressClock = null;
  function startProgressClock() {
    if (progressClock) clearInterval(progressClock);
      progressClock = setInterval(function () {
      if (!state.running) {
        clearInterval(progressClock);
        progressClock = null;
        return;
      }
      var prog = state.console && state.console.progress;
      if (prog && prog.stepId !== "done") {
        // Clock only refreshes the UI; it must not invent % (computeProgressPct freezes TTFB).
        prog.pct = computeProgressPct(prog);
        if (prog.stepId === "write" && prog.tokenChars) {
          prog.label = "Writer drafting · " + prog.tokenChars + " chars";
        } else if (prog.stepId === "verify" && prog.tokenChars) {
          prog.label = "Verifier drafting · " + prog.tokenChars + " chars";
        }
        // Keep server-provided waiting/verify/improve labels (include real elapsed).
        state.console.stage = prog.label;
      }
      patchProgressUi();
    }, 500);
  }
  function stopProgressClock() {
    if (progressClock) {
      clearInterval(progressClock);
      progressClock = null;
    }
  }

  async function runLab() {
    if (!state.hearing || state.running) return;
    var gate = configGateError(state.selected, collectPastedKeys(), "nav");
    if (gate) {
      msg(gate, false);
      go("config", 0);
      return;
    }
    state.running = true;
    state.rows = [];
    state.runAt = "";
    state.lastError = "";
    state.console = {
      status: "write",
      stage: "Starting pipeline…",
      text: "",
      sections: [],
      writer: (state.selected || [])[0] || "",
      meta: "原稿作成",
      progress: null
    };
    initRunProgress(state.selected, null);
    go("results", 3);
    msg("Pipeline running…");
    startProgressClock();
    try {
      var res = await fetch(api("/v1/lab/run/stream"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          hearing: state.hearing,
          model_ids: state.selected,
          mode: "production",
          page: "both",
          use_lab_prompt: true
        })
      });
      if (!res.ok || !res.body) {
        var err = {};
        try { err = await res.json(); } catch (e) {}
        throw new Error(err.detail || ("HTTP " + res.status));
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var parts = buf.split("\n\n");
        buf = parts.pop() || "";
        for (var pi = 0; pi < parts.length; pi++) {
          var block = parts[pi];
          var line = block.split("\n").filter(function (l) {
            return l.indexOf("data:") === 0;
          }).map(function (l) { return l.slice(5).trim(); }).join("");
          if (!line) continue;
          var ev;
          try { ev = JSON.parse(line); } catch (e) { continue; }
          handleStreamEvent(ev);
        }
      }
      state.max = Math.max(state.max, 3);
      if (state.console.status === "fail" || state.lastError) {
        go("results", 3);
        msg(state.lastError || state.console.stage || "Writing failed", false);
      } else if ((state.console.sections || []).length) {
        state.max = Math.max(state.max, 4);
        go("results", 3);
        msg("セクション完成。", true);
      } else if (state.rows[0] && state.rows[0].ok === false) {
        var failMsg = state.rows[0].error || "Writing failed";
        state.console.status = "fail";
        state.console.stage = failMsg;
        go("results", 3);
        msg(failMsg, false);
      } else {
        go("results", 3);
        msg("原稿処理が終わりました。", true);
      }
    } catch (e) {
      state.console.status = "fail";
      state.console.stage = e.message || "Failed";
      msg(e.message || "Writing failed", false);
      go("results", 3);
    } finally {
      stopProgressClock();
      state.running = false;
      draw();
    }
  }

  function handleStreamEvent(ev) {
    if (!ev || !ev.type) return;
    if (ev.type === "start") {
      state.runAt = ev.run_at || "";
      state.console.writer = ev.writer || state.console.writer;
      state.console.meta = "writer " + (ev.writer || "") +
        (ev.quality_writer ? " · polish " + ev.quality_writer : "") +
        (ev.verifiers && ev.verifiers.length ? " · verifier " + ev.verifiers.join(",") : "");
      state.console.status = "write";
      state.console.sections = [];
      initRunProgress(state.selected, ev);
      setProgressStage("write", "Writer drafting");
      draw();
      return;
    }
    if (ev.type === "model_start") {
      state.console.status = "write";
      state.console.text = "";
      state.console.sections = [];
      if (!state.console.progress) initRunProgress(state.selected, null);
      setProgressStage("write", "Writer drafting");
      draw();
      return;
    }
    if (ev.type === "token") {
      state.console.text = (state.console.text || "") + (ev.text || "");
      bumpWriteProgress(ev.text || "");
      return;
    }
    if (ev.type === "stage") {
      var label =
        ev.id === "verify" ? "Verifier checking facts" :
        ev.id === "ground" ? "Grounding & sealing" :
        ev.id === "improve" ? "Improve polishing draft" :
        ev.id === "quality_swap" ? "Improve applied" :
        ev.id === "write" ? "Writer drafting" : String(ev.id || "");
      setProgressStage(ev.id, label);
      if (typeof ev.progress === "number" || typeof ev.chars === "number") {
        applyServerProgress(ev.progress, ev.chars);
      }
      if (ev.id === "verify" || ev.id === "ground" || ev.id === "quality_swap" || ev.id === "improve") {
        state.console.status = "verify";
      } else if (ev.id === "write") {
        state.console.status = "write";
      }
      if (document.getElementById("runProgress")) patchProgressUi();
      else draw();
      return;
    }
    if (ev.type === "progress") {
      // Live heartbeat — label/elapsed update always; % only from real work.
      if (ev.stage) setProgressStage(ev.stage, ev.label || state.console.stage);
      applyServerProgress(ev.progress, ev.chars, !!ev.waiting_first_token);
      if (ev.label) {
        state.console.stage = ev.label;
        if (state.console.progress) state.console.progress.label = ev.label;
      }
      patchProgressUi();
      return;
    }
    if (ev.type === "error") {
      state.console.status = "fail";
      state.console.stage = ev.message || "Failed";
      state.lastError = ev.message || "Failed";
      msg(ev.message || "Failed", false);
      draw();
      return;
    }
    if (ev.type === "model_done") {
      finishProgress();
      applyFinishedSections(ev.row || {});
      return;
    }
    if (ev.type === "done") {
      state.rows = ev.rows || [];
      state.runAt = ev.run_at || state.runAt;
      finishProgress();
      if (ev.ok === false || ev.error) {
        state.console.status = "fail";
        state.console.stage = ev.error || state.lastError || "Failed";
        state.lastError = ev.error || state.lastError || "";
        msg(state.console.stage, false);
      } else if (!(state.console.sections || []).length && state.rows[0]) {
        applyFinishedSections(state.rows[0]);
      }
    }
  }

  function isLegacyWpSections(sections) {
    var ids = (sections || []).map(function (s) { return String(s.id || ""); });
    if (!ids.length) return true;
    if (ids.indexOf("wp_title") >= 0 || ids.indexOf("body_1") >= 0) return true;
    if (ids.indexOf("heading") >= 0 && ids.indexOf("top_hero") < 0) return true;
    var hasService = ids.some(function (id) {
      return id.indexOf("service_") === 0;
    });
    return !hasService;
  }

  function flattenSectionValue(value) {
    if (value == null) return "";
    if (typeof value === "string") return value.trim();
    if (Array.isArray(value)) {
      return value.map(function (item) {
        if (item && typeof item === "object") {
          if (item.name) {
            return [item.name, item.duration, item.price].filter(Boolean).join(" / ");
          }
          if (item.heading || item.body) {
            return [item.heading, item.body].filter(Boolean).join("\n");
          }
          if (item.title || item.body) {
            return [item.title, item.body].filter(Boolean).join("：");
          }
          return Object.keys(item).map(function (k) { return item[k]; })
            .filter(Boolean).join(" ");
        }
        return String(item || "");
      }).filter(Boolean).join("\n");
    }
    if (typeof value === "object") {
      if (value.enabled === false) {
        return "（省略）" + String(value.reason_if_disabled || "").trim();
      }
      var keys = [
        "brand_name", "catchcopy", "subcopy", "heading", "lead", "body", "cta",
        "station", "address", "phone", "hours", "closed", "payment", "parking",
        "method", "items", "points", "services"
      ];
      var lines = [];
      var seen = {};
      keys.forEach(function (k) {
        if (!(k in value)) return;
        seen[k] = true;
        var chunk = flattenSectionValue(value[k]);
        if (chunk) lines.push(chunk);
      });
      Object.keys(value).forEach(function (k) {
        if (seen[k] || k === "enabled" || k === "reason_if_disabled" || k === "id" ||
            k === "page" || k === "checklist" || k === "qa") return;
        var chunk = flattenSectionValue(value[k]);
        if (chunk) lines.push(chunk);
      });
      return lines.join("\n");
    }
    return String(value).trim();
  }

  function buildSectionsFromWordpress(wp, copy) {
    wp = wp || {};
    copy = copy || {};
    var pages = {};
    (wp.pages || []).forEach(function (p) {
      if (p && p.id) pages[p.id] = p;
    });
    var home = pages.home || {};
    var servicePage = pages.service || {};
    var menu = pages.menu || {};
    var access = pages.access || {};
    var contact = pages.contact || {};
    var bundle = wp.sections || {};
    var top = bundle.top || (home.sections && typeof home.sections === "object" ? home.sections : {}) || {};
    var service = bundle.service ||
      (servicePage.sections && typeof servicePage.sections === "object" ? servicePage.sections : {}) || {};
    var catalog = promptSectionsCatalog();
    var topItems = ((catalog.tabs || []).filter(function (t) { return t.id === "top"; })[0] || {}).items || [];
    var serviceItems = ((catalog.tabs || []).filter(function (t) { return t.id === "service"; })[0] || {}).items || [];
    var out = [];
    function push(id, wpPage, labelJa, labelEn, text) {
      out.push({
        id: id,
        wp_page: wpPage,
        label_ja: labelJa,
        label_en: labelEn,
        text: String(text || "")
      });
    }
    push("home_title", "home", "TOP SEOタイトル", "Home title", home.title || copy.title || "");
    push("home_slug", "home", "TOP スラッグ", "Home slug", home.slug || copy.slug || "home");
    topItems.forEach(function (it) {
      var sid = it.id;
      var text = flattenSectionValue(top[sid]);
      if (!text && (sid === "greeting" || sid === "reviews")) text = "（省略）";
      push("top_" + sid, "home", it.web || it.label || sid, it.label || sid, text);
    });
    push("service_title", "service", "Service SEOタイトル", "Service title",
      servicePage.title || service.seo_title || "");
    push("service_slug", "service", "Service スラッグ", "Service slug",
      servicePage.slug || "service");
    serviceItems.forEach(function (it) {
      var sid = it.id;
      push("service_" + sid, "service", it.web || it.label || sid, it.label || sid,
        flattenSectionValue(service[sid]));
    });
    if (menu && (menu.items || menu.lead)) {
      var menuText = Array.isArray(menu.items)
        ? menu.items.map(function (item) {
            return [item.name, item.duration, item.price].filter(Boolean).join(" / ");
          }).filter(Boolean).join("\n")
        : String(menu.lead || "");
      push("menu_page", "menu", "メニューページ", "Menu page", menuText);
    }
    if (access) {
      var accessText = Array.isArray(access.body_paragraphs)
        ? access.body_paragraphs.filter(Boolean).join("\n")
        : "";
      push("access_page", "access", "アクセスページ", "Access page", accessText);
    }
    if (contact) {
      var contactText = Array.isArray(contact.body_paragraphs)
        ? contact.body_paragraphs.filter(Boolean).join("\n")
        : "";
      push("contact_page", "contact", "お問い合わせページ", "Contact page", contactText);
    }
    if (copy.notes) push("notes", "home", "メモ", "Notes", copy.notes);
    return out;
  }

  function normalizeRowSections(row) {
    row = row || {};
    var sections = row.sections || [];
    var wp = row.wordpress || {};
    var hasBundle = !!(wp.sections && (wp.sections.top || wp.sections.service));
    if ((!sections.length || isLegacyWpSections(sections)) && hasBundle) {
      sections = buildSectionsFromWordpress(wp, row.copy || {});
      row.sections = sections;
    }
    return sections;
  }

  function applyFinishedSections(row) {
    row = row || {};
    var sections = normalizeRowSections(row);
    if (!sections.length) {
      state.console.status = row.ok ? "ok" : "fail";
      state.console.stage = row.ok ? "完成" : (row.error || "Failed");
      draw();
      return false;
    }
    state.console.status = row.ok === false ? "fail" : "ok";
    state.console.stage = "完成";
    state.console.sections = sections.map(function (s) {
      return {
        id: s.id,
        label_ja: s.label_ja,
        label_en: s.label_en,
        wp_page: s.wp_page,
        text: s.text || ""
      };
    });
    // Keep row in sync so CSV download uses all header sections too.
    if (state.rows && state.rows[0]) state.rows[0].sections = state.console.sections.slice();
    else if (row && row.ok !== false) state.rows = [row];
    if (!state.sectionsPage) state.sectionsPage = "top";
    if (isLegacyWpSections(sections)) {
      msg("Still on legacy sections (body_1). Hard-refresh this page, then press 再生成.", false);
    }
    draw();
    return true;
  }

  function patchConsole() {
    // Final sections UI is drawn via viewResults(); no live prose panel.
    if (state.step === "results") draw();
  }

  function sectionExportRows(row, sections) {
    return (sections || [])
      .filter(function (s) {
        // Internal lab memo — not a WordPress CMS field.
        return s && s.id && s.id !== "notes";
      })
      .map(function (s) {
        return [
          s.id || "",
          s.label_ja || "",
          s.wp_page || "home",
          s.text || ""
        ];
      });
  }

  function downloadCsv() {
    try {
      var row = (state.rows || [])[0] || {};
      var sections = normalizeRowSections(row);
      if (!sections.length) sections = state.console.sections || [];
      var rows = sectionExportRows(row, sections);
      if (!rows.length) throw new Error("No WordPress sections to download");
      var headers = ["field", "label", "wp_page", "content"];
      var lines = [headers].concat(rows).map(function (cols) {
        return cols.map(function (c) {
          var v = String(c == null ? "" : c);
          if (/[",\n\r]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
          return v;
        }).join(",");
      });
      var blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      var shop = (state.hearing && state.hearing.business_name) || "hearing";
      a.download = "WP_" + shop + ".csv";
      a.click();
      URL.revokeObjectURL(a.href);
      msg("CSV downloaded (WordPress fields only)", true);
    } catch (e) {
      msg(e.message || "CSV download failed", false);
    }
  }

  async function boot() {
    try {
      msg("Loading config…");
      await loadConfig();
      draw();
      msg("BBS-CMS AI ready. Start with Config, then Hearing.", true);
    } catch (e) {
      draw();
      var err = e && e.name === "AbortError"
        ? "Config request timed out. Refresh, or check /v1/lab/config."
        : (e.message || "Boot failed");
      msg(err, false);
    }
  }
  // Draw shell immediately so the page never looks stuck blank.
  try { stepper(); } catch (e) {}
  boot();
})();
</script>
