<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>BBS-CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;family=Shippori+Mincho:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1916;
    --muted: #7a7368;
    --line: #e4ddd2;
    --bg: #efeae2;
    --white: #fffcf7;
    --green: #1f6b48;
    --green-soft: #e7f3ec;
    --wp: #1d5f9e;
    --wp-soft: #e8f1f8;
    --gold: #b48a3c;
    --shop-base: #f7f1e8;
    --shop-ink: #2a271f;
    --shop-accent: #2a7d4f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 420px at 50% -80px, #f7f3ec 0%, transparent 70%),
      var(--bg);
    color: var(--ink);
    font: 15px/1.65 "Noto Sans JP", "Hiragino Sans", ui-sans-serif, sans-serif;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  .app { min-height: 100%; }
  header {
    position: sticky; top: 0; z-index: 30;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 28px;
    background: var(--white);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark {
    width: 24px; height: 24px; border-radius: 7px;
    background: linear-gradient(160deg, #2a8a5a, var(--green));
    color: #fff; display: grid; place-items: center; font-size: 8px; font-weight: 800; letter-spacing: .04em;
  }
  .brand strong { display: block; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
  .brand small { display: none; }
  .lang { display: flex; background: #f4efe7; border-radius: 8px; padding: 2px; }
  .lang button { border: 0; background: transparent; padding: 5px 11px; font-size: 11px; font-weight: 700; color: var(--muted); border-radius: 6px; }
  .lang button.on { background: var(--ink); color: #fff; }
  .steps-bar {
    position: sticky; top: 49px; z-index: 20;
    background: #e8e2d8;
    border-bottom: 1px solid #d5cdc0;
    padding: 12px 28px 14px;
  }
  .steps-inner {
    max-width: 1080px; margin: 0 auto;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 10px;
    box-shadow: 0 4px 14px rgba(40, 30, 16, .04);
  }
  .steps-label {
    margin: 0 auto 6px; max-width: 1080px;
    font-size: 10px; font-weight: 800; letter-spacing: .14em; color: var(--muted);
  }
  .story {
    display: flex; align-items: stretch; gap: 0;
  }
  .st {
    flex: 1; min-width: 0; border: 0; background: transparent;
    padding: 8px 10px; text-align: left; color: var(--muted);
    border-radius: 8px;
  }
  .st b {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%;
    font-size: 9px; letter-spacing: 0; margin: 0 6px 0 0; vertical-align: middle;
    background: #ece6dc; color: var(--muted); font-weight: 800;
  }
  .st span {
    display: inline; font-size: 12px; font-weight: 650; color: var(--ink); opacity: .32;
    white-space: nowrap;
  }
  .st.on { background: var(--green-soft); }
  .st.on b { background: var(--green); color: #fff; }
  .st.on span, .st.done span { opacity: 1; }
  .st.done b { background: #d7eadf; color: var(--green); }
  .st.on.done b { background: var(--green); color: #fff; }
  .st.wp.on { background: var(--wp-soft); }
  .st.wp.on b { background: var(--wp); }
  .st.wp.done b { background: #d6e6f4; color: var(--wp); }
  .st.wp.on.done b { background: var(--wp); color: #fff; }
  .st:disabled { cursor: default; opacity: .55; }
  .gate {
    display: flex; align-items: center; padding: 0 4px;
    font-size: 8px; font-weight: 800; letter-spacing: .12em; color: var(--wp);
  }
  .gate i {
    font-style: normal; background: var(--wp-soft); border: 1px solid #c9dcea;
    padding: 3px 7px; border-radius: 999px; white-space: nowrap;
  }
  main { padding: 18px 28px 48px; max-width: 1080px; width: 100%; margin: 0 auto; }
  .say {
    margin: 0 0 2px; font-size: 17px; font-weight: 700; letter-spacing: -.02em; line-height: 1.4;
  }
  .hint { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .say.hid, .hint.hid, .deploy-note.hid { display: none; }
  .deploy-note {
    margin: 0 0 14px; padding: 10px 14px; border-radius: 10px;
    background: #fff6df; border: 1px solid #ead7a0; color: #6a5318; font-size: 12px; line-height: 1.55;
  }
  .chip {
    display: inline-flex; align-items: center;
    font-size: 10px; font-weight: 800; letter-spacing: .1em;
    padding: 4px 9px; border-radius: 999px; margin-bottom: 10px;
  }
  .chip.b { background: var(--wp-soft); color: var(--wp); }
  .chip.gold { background: #f6edd8; color: #7a5c1e; }

  .doc {
    background: var(--white); border: 1px solid #d9d3c8; border-radius: 14px;
    overflow: hidden; box-shadow: 0 20px 50px rgba(40, 30, 16, .08);
  }
  .xls-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 11px 16px; background: linear-gradient(180deg, #2a8a5a, #1f6b48); color: #fff;
  }
  .xls-bar span { font-size: 13px; font-weight: 700; }
  .xls-bar small { font-weight: 500; opacity: .8; margin-left: 8px; font-size: 12px; }
  .xls-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .xls-dl, .xls-up, .xls-reset {
    color: #fff; text-decoration: none; font-size: 11px; font-weight: 700;
    background: rgba(255,255,255,.16); padding: 6px 11px; border-radius: 8px; border: 0; cursor: pointer;
  }
  .xls-up { cursor: pointer; display: inline-block; }
  .xls-up:hover, .xls-dl:hover, .xls-reset:hover { background: rgba(255,255,255,.26); }
  .xls-reset { color: #fff; }
  .xls-tabs {
    display: flex; gap: 0; padding: 0 12px; background: #f6f2ea; border-bottom: 1px solid var(--line);
  }
  .xls-tabs button {
    border: 0; background: transparent; padding: 10px 16px; font-size: 12px; font-weight: 700;
    color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .xls-tabs button.on { color: var(--green); border-bottom-color: var(--green); background: #fff; }
  .xls-wrap { overflow: auto; background: #fff; padding: 0; }
  .xls-grid { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .xls-grid th {
    background: #f8f5ef; border-bottom: 1px solid var(--line); padding: 8px 14px;
    font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--muted); text-align: left;
  }
  .xls-grid td { border-bottom: 1px solid #efeae2; padding: 10px 14px; vertical-align: top; line-height: 1.55; }
  .xls-grid td.xnum { color: #b4ada3; text-align: right; width: 36px; font-size: 11px; padding-right: 0; vertical-align: top; }
  .xls-grid td.xkey { color: var(--muted); font-weight: 650; min-width: 120px; max-width: 34%; white-space: normal; word-break: break-word; vertical-align: top; }
  .xls-grid td.xval { color: var(--ink); min-width: 160px; word-break: break-word; white-space: pre-wrap; vertical-align: top; }
  .xls-grid td.xhead { color: var(--muted); font-weight: 650; min-width: 180px; max-width: 42%; word-break: break-word; vertical-align: top; font-size: 12px; }
  .xls-grid tr.placeholder td { opacity: .55; }
  .xls-profile { font-size: 10px; font-weight: 800; letter-spacing: .06em; background: rgba(255,255,255,.18); padding: 4px 8px; border-radius: 999px; margin-left: 8px; }
  .xls-empty { padding: 28px 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .xls-grid tr:hover td { background: #fbf8f2; }
  .xcell-input { width: 100%; border: 0; background: transparent; padding: 0; font: inherit; font-weight: 700; color: inherit; }
  .xls-foot {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; background: #faf7f1; border-top: 1px solid var(--line);
  }
  .xls-foot p { margin: 0; font-size: 12px; color: var(--muted); }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 700; font-size: 13px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.g { background: var(--green); color: #fff; box-shadow: 0 8px 18px rgba(31, 107, 72, .2); }
  .btn.b { background: var(--wp); color: #fff; box-shadow: 0 8px 18px rgba(29, 95, 158, .2); }
  .btn.w { background: #fff; border: 1px solid var(--line); color: var(--ink); }
  .btn:disabled { opacity: .38; cursor: not-allowed; transform: none; box-shadow: none; }

  .upload-stage {
    background: var(--white); border: 1px solid var(--line); border-radius: 18px;
    padding: 48px 32px; text-align: center;
    box-shadow: 0 20px 50px rgba(40, 30, 16, .06);
  }
  .upload-icon {
    width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px;
    background: linear-gradient(160deg, #e7f3ec, #d7eadf); color: var(--green);
    display: grid; place-items: center; font-size: 22px; font-weight: 800;
  }
  .upload-stage h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .upload-stage p { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .upload-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .upload-big { display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; cursor: pointer; }
  .upload-note { margin-top: 18px; font-size: 12px; color: #a39888; }

  .ai-studio {
    background: #f7f7f8; border: 1px solid #e5e5e5; border-radius: 20px;
    overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, .06);
    min-height: 520px; display: flex; flex-direction: column;
  }
  .ai-top {
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; background: #fff; border-bottom: 1px solid #ececec;
  }
  .ai-brand { display: flex; align-items: center; gap: 10px; }
  .ai-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(145deg, #10a37f, #0d8a6a); color: #fff;
    display: grid; place-items: center; font-size: 10px; font-weight: 800;
  }
  .ai-brand strong { display: block; font-size: 13px; font-weight: 700; color: #202123; }
  .ai-brand small { display: block; font-size: 11px; color: #6e6e80; margin-top: 1px; }
  .ai-progress { display: flex; gap: 6px; flex-wrap: wrap; }
  .ai-pill {
    font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 5px 10px; border-radius: 999px;
    background: #f0f0f0; color: #8e8ea0;
  }
  .ai-pill.on { background: #e7f3ec; color: var(--green); }
  .ai-pill.done { background: #ececec; color: #565869; }
  .ai-thread {
    flex: 1; overflow: auto; padding: 24px 20px 20px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .ai-msg { display: flex; gap: 12px; align-items: flex-start; max-width: 820px; width: 100%; margin: 0 auto; }
  .ai-msg.user { flex-direction: row-reverse; margin-left: auto; }
  .ai-avatar {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 10px; font-weight: 800;
  }
  .ai-msg.assistant .ai-avatar { background: #10a37f; color: #fff; }
  .ai-msg.user .ai-avatar { background: #5436da; color: #fff; }
  .ai-bubble {
    flex: 1; min-width: 0; background: #fff; border: 1px solid #ececec;
    border-radius: 14px; padding: 16px 18px; line-height: 1.75; color: #353740; font-size: 14.5px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .ai-msg.user .ai-bubble { background: #f7f7f8; color: #202123; }
  .ai-note {
    max-width: 820px; width: 100%; margin: 0 auto;
    font-size: 12px; color: #8e8ea0; padding: 0 42px;
  }
  .ai-composer {
    border-top: 1px solid #ececec; background: #fff; padding: 14px 20px 18px;
  }
  .ai-composer-inner {
    max-width: 820px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: #f7f7f8; border: 1px solid #ececec; border-radius: 16px;
    padding: 10px 12px 10px 18px;
  }
  .ai-composer p { margin: 0; font-size: 13px; color: #565869; line-height: 1.5; }
  .ai-composer .actions { margin: 0; }
  .ai-busy {
    display: flex; align-items: center; gap: 10px;
    color: #8e8ea0; font-size: 13px;
  }
  .ai-bubble .sec { margin-top: 18px; padding-top: 16px; border-top: 1px solid #f0f0f0; }
  .ai-bubble .sec:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .ai-bubble .sec-lab {
    font-size: 10px; font-weight: 800; letter-spacing: .14em; color: #8e8ea0; margin-bottom: 8px;
  }
  .ai-bubble h3 {
    margin: 0 0 10px; font-size: 22px; line-height: 1.45; font-weight: 650;
    font-family: "Shippori Mincho", serif; color: #202123;
  }
  .ai-bubble .lead { margin: 0; font-size: 15px; line-height: 1.85; color: #353740; }
  .ai-bubble .para { margin: 0 0 12px; font-size: 14.5px; line-height: 1.85; color: #353740; }
  .ai-bubble .para:last-child { margin-bottom: 0; }
  .ai-bubble .cta-pill {
    display: inline-block; margin-top: 4px; padding: 8px 16px; border-radius: 999px;
    background: var(--green); color: #fff; font-size: 12px; font-weight: 700;
  }
  .ai-cursor {
    display: inline-block; width: 2px; height: 1em; background: #10a37f;
    margin-left: 2px; vertical-align: text-bottom; animation: blink .9s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .ai-typing {
    display: inline-flex; gap: 4px; align-items: center; padding: 2px 0;
  }
  .ai-typing i {
    width: 5px; height: 5px; border-radius: 50%; background: #8e8ea0;
    animation: typdot 1.2s ease-in-out infinite;
  }
  .ai-typing i:nth-child(2) { animation-delay: .15s; }
  .ai-typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes typdot { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-3px); opacity: 1; } }

  .copy-wrap {
    background: #fbf7f0;
    border: 1px solid #e0d6c6;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 56px rgba(40, 30, 16, .08);
  }
  .copy-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 11px 28px; background: #2a271f; color: #f3eadc;
    font-size: 11px; font-weight: 700; letter-spacing: .12em;
  }
  .copy-banner.writing { justify-content: flex-start; }
  .copy-banner .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #c4a574; flex-shrink: 0;
    animation: pulse 1.1s ease-in-out infinite;
  }
  .copy-banner em { font-style: normal; color: #c4a574; font-weight: 800; }
  .copy-body {
    padding: 40px 48px 44px;
    max-width: 760px;
    margin: 0 auto;
    background:
      linear-gradient(180deg, rgba(255,255,255,.55) 0%, transparent 80px),
      #fbf7f0;
  }
  .copy-kicker {
    font-size: 11px; font-weight: 700; letter-spacing: .18em; color: var(--green);
    margin: 0 0 14px;
  }
  .copy-part { margin-bottom: 28px; }
  .copy-part:last-child { margin-bottom: 0; }
  .copy-lab {
    font-size: 10px; font-weight: 800; letter-spacing: .16em; color: #a39888;
    margin-bottom: 10px;
  }
  .copy-part h2 {
    margin: 0; font-size: 32px; line-height: 1.4; font-weight: 700;
    font-family: "Shippori Mincho", serif; letter-spacing: .02em;
  }
  .copy-rule {
    width: 48px; height: 1px; background: #c4a574; margin: 22px 0 0; border: 0;
  }
  .copy-part .lead {
    margin: 0; font-size: 17px; line-height: 2; color: #3d3932;
    font-family: "Shippori Mincho", serif;
  }
  .copy-part .text p {
    margin: 0 0 18px; font-size: 15.5px; line-height: 2.05; color: #3d3932;
  }
  .copy-part .text p:last-child { margin-bottom: 0; }
  .copy-btn {
    display: inline-block; background: var(--green); color: #fff;
    padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 13px;
    letter-spacing: .04em; box-shadow: 0 10px 22px rgba(31, 107, 72, .22);
  }
  .pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  .decide {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-top: 14px; padding: 14px 16px; background: var(--white);
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 8px 24px rgba(40, 30, 16, .04);
  }
  .decide p { margin: 0; font-size: 14px; font-weight: 700; }

  .browser {
    background: var(--white); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    box-shadow: 0 22px 50px rgba(40, 30, 16, .1);
  }
  .chrome {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px;
    background: #ece7de; border-bottom: 1px solid var(--line);
  }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #c9c0b3; }
  .url {
    flex: 1; background: #fff; border: 1px solid #ddd6ca; border-radius: 999px;
    padding: 4px 12px; font-size: 12px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 10px;
  }
  .badge { font-size: 10px; font-weight: 800; letter-spacing: .06em; color: var(--wp); background: var(--wp-soft); padding: 2px 7px; border-radius: 999px; }
  .badge.live { color: var(--green); background: var(--green-soft); animation: none; }
  .tabs { display: flex; gap: 0; background: #f4efe7; padding: 0 10px; border-bottom: 1px solid var(--line); }
  .tabs button {
    border: 0; background: transparent; padding: 11px 14px; font-size: 13px; font-weight: 700; color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  .tabs button.on { color: var(--wp); border-bottom-color: var(--wp); }
  .site { background: var(--shop-base); color: var(--shop-ink); }
  .snav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px; border-bottom: 1px solid #eadfce; font-size: 13px;
  }
  .snav strong { font-size: 16px; font-family: "Shippori Mincho", serif; font-weight: 700; }
  .snav span { color: var(--muted); letter-spacing: .04em; }
  .hero { padding: 40px 28px 22px; }
  .hero small { display: block; color: var(--shop-accent); font-size: 11px; font-weight: 800; letter-spacing: .14em; }
  .hero h2 { margin: 10px 0 14px; font-size: 30px; line-height: 1.4; font-family: "Shippori Mincho", serif; font-weight: 700; }
  .hero p { margin: 0 0 8px; }
  .cta {
    display: inline-block; background: var(--shop-accent); color: #fff; font-weight: 700;
    padding: 10px 18px; border-radius: 999px; font-size: 13px; margin-top: 10px;
  }
  .copy { padding: 4px 28px 24px; }
  .copy p { margin: 0 0 12px; font-size: 14.5px; line-height: 1.9; }
  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 28px 18px; }
  .ph {
    min-height: 132px; border: 1.5px dashed var(--gold); border-radius: 12px;
    background: repeating-linear-gradient(-45deg, #f6edd8, #f6edd8 8px, #f0e3c4 8px, #f0e3c4 16px);
    display: grid; place-items: center; text-align: center; font-size: 13px; color: #7a5c1e; width: 100%;
  }
  .ph.on {
    border-style: solid; color: #fff; font-weight: 700;
    background: linear-gradient(160deg, #8a9e7a 0%, #5e7a58 42%, #c4a574 100%);
  }
  .svc {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 16px 28px; border-top: 1px solid #eadfce; background: rgba(255,255,255,.55);
  }
  .svc b { display: block; font-family: "Shippori Mincho", serif; }
  .svc em { font-style: normal; color: var(--muted); font-size: 12px; font-weight: 500; }
  .info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #eadfce; border-top: 1px solid #eadfce; }
  .info div { background: #fff; padding: 14px 16px; font-size: 12px; }
  .info b { display: block; color: var(--muted); font-size: 10px; letter-spacing: .1em; margin-bottom: 4px; }
  .foot { padding: 14px 28px 18px; font-size: 12px; color: var(--muted); }
  .err { color: #8f3b30; font-size: 13px; margin-top: 12px; }
  .ok { color: var(--green); font-size: 13px; margin-top: 12px; }
  @media (max-width: 860px) {
    .story { overflow-x: auto; }
    .st span { display: none; }
    .st.on span { display: inline; }
    .gate { display: none; }
    .photos, .info { grid-template-columns: 1fr; }
    header, .steps-bar, main { padding-left: 16px; padding-right: 16px; }
    .steps-bar { top: 45px; }
    .copy-body { padding: 24px 20px 28px; }
    .copy-part h2 { font-size: 24px; }
  }
</style>
</head>
<body data-lang="ja">
<div class="app">
  <header>
    <div class="brand">
      <span class="mark">BBS</span>
      <div>
        <strong>BBS-CMS</strong>
        <small id="brandsub"></small>
      </div>
    </div>
    <div class="lang">
      <button type="button" data-lang="ja" class="on">日本語</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </header>
  <section class="steps-bar">
    <p class="steps-label" id="stepslabel"></p>
    <div class="steps-inner">
      <nav class="story" id="stepper"></nav>
    </div>
  </section>
  <main>
    <p class="deploy-note hid" id="deployNote"></p>
    <p class="say" id="say"></p>
    <p class="hint" id="hint"></p>
    <div id="view"></div>
    <p id="msg"></p>
  </main>
</div>
<script src="config.js"></script>
<script>
(function () {
  var STEPS = [
    { id: "hearing", ja: "ヒアリング", en: "Hearing" },
    { id: "write", ja: "AIの文章", en: "AI copy" },
    { id: "review", ja: "原稿確認", en: "Copy review" },
    { id: "wp", ja: "下書きサイト", en: "Draft site", wp: true },
    { id: "finish", ja: "写真と公開", en: "Photos", wp: true }
  ];
  var SAY = {
    hearing: ["まずヒアリングシートをアップロードしてください。", "Upload the hearing sheet first."],
    write: ["", ""],
    review: ["", ""],
    wp: ["WordPressに4ページの下書きができました。まだ公開していません。", "A 4-page WordPress draft is ready. It is not published."],
    finish: ["写真と公開は手動です。AIは公開しません。", "Photos and publish are manual. AI does not publish."]
  };
  var HINT = {
    hearing: ["CSV または JSON。テンプレートもダウンロードできます。", "CSV or JSON. You can download a template."],
    write: ["", ""],
    review: ["", ""],
    wp: ["ホーム・メニュー・アクセス・ご予約。下書きのままです。", "Home, Menu, Access, Booking. Still a draft."],
    finish: ["金色の枠をクリックして写真を入れてから、公開できます。", "Click a gold frame to add a photo, then Publish."]
  };
  var state = {
    step: "hearing", max: 0, running: false, jobId: "", xlsTab: "summary",
    hearingLoaded: false, hearingSource: "", hearingFile: "", hearingProfile: "",
    hearingTable: { summary: [], raw: [], menu_count: 0, default_tab: "summary" },
    writePhase: 0, aiStatus: "",
    costUsd: null,
    hearing: {
      business_name: "", catchcopy: "", concept: "", industry: "relaxation_salon",
      area: "", address: "", station: "", phone: "", hours: "", closed: "",
      parking: "", reservation: "", payment: "", first_visit: "", target: "", tone: "",
      atmosphere: [], menu: [], services: [], forbidden: [], missing: [],
      colors: { base: "#FBF7F0", ink: "#2C2A26", "accent-1": "#2a7d4f", "accent-2": "#C4A574" }
    },
    copy: { heading: "", lead: "", body_paragraphs: [], cta: "" },
    site: null, photos: {}, published: false, raw: "", page: "home"
  };
  var abort = null, timer = null;

  function api(path) {
    var base = String(window.DEMO_API_BASE || "").replace(/\/$/, "");
    return base + path;
  }
  function asset(name) {
    return window.DEMO_API_BASE ? api("/v1/demo/" + name) : "./" + name;
  }
  function isHostedDemo() {
    return location.hostname.endsWith("github.io") || location.hostname.endsWith("githubusercontent.com");
  }
  function showDeployNote() {
    var el = document.getElementById("deployNote");
    if (!el) return;
    if (isHostedDemo() && !window.DEMO_API_BASE) {
      el.className = "deploy-note";
      el.textContent = t(
        "プレビュー表示です。AIの文章生成には API の接続が必要です。URL に ?api=あなたのAPIのURL を付けて開いてください。",
        "Preview mode. Live AI needs an API URL. Open with ?api=YOUR_API_URL"
      );
    } else {
      el.className = "deploy-note hid";
      el.textContent = "";
    }
  }
  function loadHearingData() {
    return fetch(api("/v1/demo/hearing"))
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .catch(function () {
        return fetch("./hearing_salon.json")
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (hearing) { return { hearing: hearing }; });
      });
  }

  function L() { return document.body.getAttribute("data-lang") === "en" ? "en" : "ja"; }
  function t(ja, en) { return L() === "ja" ? ja : en; }
  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function list(v) { return Array.isArray(v) ? v : String(v || "").split(/[、,]/).map(function (x) { return x.trim(); }).filter(Boolean); }
  function pick(str, key) {
    var m = String(str).match(new RegExp('"' + key + '"\\s*:\\s*"((?:\\\\.|[^"\\\\])*)"'));
    if (!m) return "";
    try { return JSON.parse('"' + m[1] + '"'); } catch (e) { return m[1]; }
  }
  function pickArr(str) {
    var m = String(str).match(/"body_paragraphs"\s*:\s*\[([\s\S]*?)\]/);
    if (!m) return [];
    try { return JSON.parse("[" + m[1] + "]"); } catch (e) { return []; }
  }
  function msg(text, ok) {
    var el = document.getElementById("msg");
    el.className = ok ? "ok" : (text ? "err" : "");
    el.textContent = text || "";
  }
  function readForm() {
    var name = document.getElementById("business_name");
    if (name) state.hearing.business_name = name.value.trim();
    var area = document.getElementById("area");
    if (area) state.hearing.area = area.value.trim();
    if (!state.hearing.area) {
      state.hearing.area = String(state.hearing.address || state.hearing.station || "").trim();
    }
  }
  function buildTableFromHearing(h) {
    h = h || {};
    var fields = [
      ["business_name", "店名", "Shop name"],
      ["industry", "業種", "Industry"],
      ["catchcopy", "キャッチコピー", "Tagline"],
      ["concept", "コンセプト", "Concept"],
      ["target", "ターゲット", "Target"],
      ["tone", "トーン", "Tone"],
      ["area", "エリア", "Area"],
      ["address", "住所", "Address"],
      ["station", "最寄駅", "Station"],
      ["phone", "電話", "Phone"],
      ["hours", "営業時間", "Hours"],
      ["closed", "定休日", "Closed"],
      ["reservation", "予約", "Booking"],
      ["payment", "支払い", "Payment"],
      ["first_visit", "初回来店", "First visit"]
    ];
    var summary = [];
    fields.forEach(function (f) {
      var val = h[f[0]];
      if (Array.isArray(val)) val = val.join("、");
      if (val == null || String(val).trim() === "") return;
      summary.push({ key: f[0], label_ja: f[1], label_en: f[2], value: String(val) });
    });
    list(h.missing).forEach(function (item) {
      if (!summary.some(function (row) { return row.key === "missing"; })) {
        summary.push({ key: "missing", label_ja: "未確認", label_en: "Still needed", value: list(h.missing).join("、") });
      }
    });
    var menu = menuOf(h);
    return {
      summary: summary,
      raw: [],
      menu_count: menu.length,
      service_count: list(h.services).length,
      default_tab: menu.length ? "menu" : "summary"
    };
  }
  function hearingTabs(table, h) {
    table = table || { summary: [], raw: [], menu_count: 0 };
    var tabs = [];
    if ((table.summary || []).length) {
      tabs.push({ id: "summary", ja: "整理済み", en: "Summary" });
    }
    if (menuOf(h).length || (table.menu_count || 0) > 0 || list(h.services).length) {
      tabs.push({ id: "menu", ja: "メニュー", en: "Menu" });
    }
    if ((table.raw || []).length) {
      tabs.push({ id: "sheet", ja: "CSV原文", en: "CSV fields" });
    }
    if (!tabs.length) tabs.push({ id: "summary", ja: "整理済み", en: "Summary" });
    return tabs;
  }
  function pickDefaultTab(table) {
    table = table || {};
    if (table.default_tab && ["summary", "menu", "sheet"].indexOf(table.default_tab) >= 0) {
      return table.default_tab;
    }
    if ((table.menu_count || 0) > 0) return "menu";
    if ((table.raw || []).length > 12) return "sheet";
    return "summary";
  }
  function menuOf(h) {
    if (h.menu && h.menu.length) return h.menu;
    return list(h.services).map(function (name) { return { name: name, duration: "", price: t("要ヒアリング", "TBD") }; });
  }
  function hasHearing() {
    return state.hearingLoaded && !!String(state.hearing.business_name || "").trim();
  }
  function csvEscape(value) {
    var s = String(value == null ? "" : value);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function hearingCsvHeaders() {
    return ["business_name", "catchcopy", "concept", "area", "address", "station", "phone", "hours", "closed", "parking", "reservation", "payment", "first_visit", "target", "tone", "services", "forbidden", "missing"];
  }
  function hearingToCsv(h) {
    h = h || {};
    var menu = Array.isArray(h.menu) ? h.menu : [];
    var services = menu.length
      ? menu.map(function (item) {
          return [item.name, item.duration, item.price].filter(Boolean).join(" ");
        }).join("; ")
      : (Array.isArray(h.services) ? h.services.join("; ") : String(h.services || ""));
    var row = {
      business_name: h.business_name || "",
      catchcopy: h.catchcopy || "",
      concept: h.concept || "",
      area: h.area || "",
      address: h.address || "",
      station: h.station || "",
      phone: h.phone || "",
      hours: h.hours || "",
      closed: h.closed || "",
      parking: h.parking || "",
      reservation: h.reservation || "",
      payment: h.payment || "",
      first_visit: h.first_visit || "",
      target: h.target || "",
      tone: h.tone || "",
      services: services,
      forbidden: list(h.forbidden).join(", "),
      missing: list(h.missing).join(", ")
    };
    var headers = hearingCsvHeaders();
    return headers.join(",") + "\n" + headers.map(function (key) { return csvEscape(row[key]); }).join(",") + "\n";
  }
  function downloadCsv(filename, text) {
    var blob = new Blob(["\uFEFF" + text], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 800);
  }
  function templateCsv() {
    return hearingToCsv({
      business_name: "緑の間リラクゼーション",
      catchcopy: "桜新町で、仕事帰りのひと休み。",
      concept: "日常の疲れをほどく落ち着いたプライベート空間。地域密着型サロン。",
      area: "東京都世田谷区桜新町",
      address: "東京都世田谷区桜新町1-12-8 グリーンビル2F",
      station: "東急田園都市線 桜新町駅 徒歩4分",
      phone: "03-1234-5678",
      hours: "10:00–20:00（最終受付 19:00）",
      closed: "火曜定休",
      parking: "近隣コインパーキング",
      reservation: "お電話またはLINE公式アカウント",
      payment: "現金・クレジットカード（VISA/Mastercard/JCB）",
      first_visit: "初回カウンセリングあり",
      target: "桜新町周辺で働く30〜50代",
      tone: "落ち着いた丁寧語。上品すぎず初めてでも入りやすい",
      services: "アロマ 60/90分 ¥8,800/¥12,100; ヘッドスパ 40分 ¥5,500; フットケア 40分 ¥4,400; リフレッシュ 75分 ¥11,000",
      forbidden: "医療効果の断定,必ず改善する,医師監修と偽ること",
      missing: "スタッフ紹介,お客様の声,店内写真"
    });
  }
  function currentHearingFilename() {
    var file = String(state.hearingFile || "");
    if (/\.csv$/i.test(file) && !/^hearing_salon\.csv$/i.test(file)) return file;
    var base = String(state.hearing.business_name || "hearing-sheet")
      .replace(/[\\/:*?"<>|]+/g, "")
      .replace(/\s+/g, "-")
      .slice(0, 60);
    return (base || "hearing-sheet") + ".csv";
  }
  function downloadHearingSheet() {
    if (hasHearing()) {
      readForm();
      downloadCsv(currentHearingFilename(), hearingToCsv(state.hearing));
      return;
    }
    downloadCsv("hearing-sheet.csv", templateCsv());
  }

  function viewAiStudio() {
    var h = state.hearing;
    var c = state.copy || {};
    var paras = c.body_paragraphs || [];
    var hasContent = !!(c.heading || c.lead || paras.length || c.cta);
    var done = !state.running && hasContent;
    var phase = done ? 3 : (state.writePhase || 1);
    var pills = [
      { n: 1, ja: "ヒアリング確認", en: "Hearing check" },
      { n: 2, ja: "高速執筆", en: "Fast draft" },
      { n: 3, ja: "並列検証", en: "Parallel verify" }
    ];
    var pillHtml = pills.map(function (p) {
      var cls = "ai-pill" + (phase > p.n || done ? " done" : "") + (phase === p.n && !done ? " on" : "") + (done && p.n === 3 ? " on" : "");
      return '<span class="' + cls + '">' + t(p.ja, p.en) + "</span>";
    }).join("");
    var draft = "";
    if (c.heading) {
      draft += '<div class="sec"><div class="sec-lab">' + t("見出し", "Headline") + "</div><h3>" + esc(c.heading) + "</h3></div>";
    } else if (state.running) {
      draft += '<div class="sec"><div class="sec-lab">' + t("見出し", "Headline") + '</div><span class="ai-typing"><i></i><i></i><i></i></span></div>';
    }
    if (c.lead) {
      draft += '<div class="sec"><div class="sec-lab">' + t("リード文", "Lead") + '</div><p class="lead">' + esc(c.lead) + "</p></div>";
    } else if (state.running && c.heading) {
      draft += '<div class="sec"><div class="sec-lab">' + t("リード文", "Lead") + '</div><span class="ai-typing"><i></i><i></i><i></i></span></div>';
    }
    if (paras.length) {
      draft += '<div class="sec"><div class="sec-lab">' + t("本文", "Body") + "</div>";
      draft += paras.map(function (p) { return '<p class="para">' + esc(p) + "</p>"; }).join("");
      draft += "</div>";
    } else if (state.running && c.lead) {
      draft += '<div class="sec"><div class="sec-lab">' + t("本文", "Body") + '</div><span class="ai-typing"><i></i><i></i><i></i></span></div>';
    }
    if (c.cta) {
      draft += '<div class="sec"><div class="sec-lab">CTA</div><span class="cta-pill">' + esc(c.cta) + "</span></div>";
    }
    if (!hasContent && state.running) {
      draft = '<span class="ai-typing"><i></i><i></i><i></i></span>';
    }
    var cursor = state.running ? '<span class="ai-cursor"></span>' : "";
    var note = "";
    if (state.running) {
      note = '<p class="ai-note">' + esc(state.aiStatus || t("原稿を書いています…", "Writing the draft…")) + "</p>";
    } else if (done) {
      note = '<p class="ai-note">' + t("原稿が完成しました。この内容で進めてよいかご確認ください。", "Draft complete. Please review before continuing.") + "</p>";
      if (state.costUsd !== null && state.costUsd !== undefined) {
        var usd = Number(state.costUsd);
        note += '<p class="ai-note ai-cost">' + t("推定コスト", "Estimated cost") + ": $" + (isNaN(usd) ? String(state.costUsd) : usd.toFixed(6)) + "</p>";
      }
    }
    var composer = state.running
      ? '<div class="ai-composer"><div class="ai-composer-inner"><div class="ai-busy"><span class="ai-typing"><i></i><i></i><i></i></span>' +
        t("執筆中です。完成までお待ちください。", "Writing. Please wait until the draft is complete.") +
        "</div></div></div>"
      : (done
        ? '<div class="ai-composer"><div class="ai-composer-inner"><p>' +
          t("この日本語を使いますか？", "Use this Japanese?") +
          '</p><div class="actions"><button class="btn b" id="ok">' + t("使える → WordPressへ", "Yes → WordPress") +
          '</button><button class="btn w" id="again">' + t("書き直す", "Rewrite") + "</button></div></div></div>"
        : "");
    return '<div class="ai-studio">' +
      '<div class="ai-top">' +
      '<div class="ai-brand"><span class="ai-mark">AI</span><div><strong>BBS AI Writer</strong><small>' +
      esc(h.business_name || t("ホームページ原稿", "Homepage copy")) + "</small></div></div>" +
      '<div class="ai-progress">' + pillHtml + "</div></div>" +
      '<div class="ai-thread">' +
      '<div class="ai-msg user"><span class="ai-avatar">You</span><div class="ai-bubble">' +
      t("このヒアリングシートの内容をもとに、トップページの日本語原稿を書いてください。", "Write homepage Japanese copy based on this hearing sheet.") +
      "</div></div>" +
      '<div class="ai-msg assistant"><span class="ai-avatar">AI</span><div class="ai-bubble">' +
      draft + cursor + "</div></div>" + note + "</div>" + composer + "</div>";
  }

  function stepper() {
    var html = "";
    STEPS.forEach(function (s, i) {
      if (s.id === "wp") html += '<div class="gate"><i>WP</i></div>';
      var cls = "st" + (s.wp ? " wp" : "") + (state.step === s.id ? " on" : "") + (i <= state.max ? " done" : "");
      html += '<button class="' + cls + '" data-id="' + s.id + '"' + (i > state.max ? " disabled" : "") + "><b>" + (i + 1) + "</b><span>" + (L() === "ja" ? s.ja : s.en) + "</span></button>";
    });
    document.getElementById("stepper").innerHTML = html;
    document.querySelectorAll(".st").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.disabled) return;
        state.step = b.getAttribute("data-id");
        draw();
      });
    });
  }

  function preview(page, photoMode) {
    var h = state.hearing, c = state.copy || {}, site = state.site;
    var items = menuOf(h);
    var nav = ((site && site.nav) || [
      { id: "home", label: t("ホーム", "Home") },
      { id: "menu", label: t("メニュー", "Menu") },
      { id: "access", label: t("アクセス", "Access") },
      { id: "contact", label: t("ご予約", "Booking") }
    ]);
    var inner;
    if (page === "menu") {
      inner = '<div class="hero"><small>' + esc(h.business_name) + "</small><h2>" + t("メニュー", "Menu") + "</h2><p>" + t("所要時間と料金は、お店から聞いた内容です。", "Times and prices come from the hearing.") + "</p></div>" +
        items.map(function (s) {
          return '<div class="svc"><span><b>' + esc(s.name) + "</b><em>" + esc(s.duration || "") +
            (s.description ? " · " + esc(s.description) : "") + "</em></span><span>" + esc(s.price || "") + "</span></div>";
        }).join("") + photosRow(["menu"], photoMode);
    } else if (page === "access") {
      inner = '<div class="hero"><small>' + t("アクセス", "Access") + "</small><h2>" + esc(h.station || h.area) + "</h2>" +
        "<p>" + esc(h.address || "") + "</p>" +
        "<p>" + t("営業時間", "Hours") + " " + esc(h.hours) + (h.closed ? " / " + esc(h.closed) : "") + "</p>" +
        (h.parking ? "<p>" + t("駐車場", "Parking") + " " + esc(h.parking) + "</p>" : "") + "</div>";
    } else if (page === "contact") {
      inner = '<div class="hero"><small>' + t("ご予約", "Booking") + "</small><h2>" + t("ご予約・お問い合わせ", "Book / enquire") + "</h2>" +
        "<p>" + esc(h.reservation || "") + "</p>" +
        "<p>TEL " + esc(h.phone || "") + "</p>" +
        '<span class="cta">' + esc(c.cta || t("ご予約はこちら", "Book")) + "</span></div>";
    } else {
      var paras = (c.body_paragraphs || []).slice(0, 4);
      inner = '<div class="hero"><small>' + esc(h.catchcopy || h.area) + "</small><h2>" +
        esc(c.heading || "") + "</h2><p>" + esc(c.lead || "") + '</p><span class="cta">' + esc(c.cta || "") + "</span></div>" +
        photosRow(["home1", "home2"], photoMode) + '<div class="copy">' +
        paras.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div>";
    }
    var tabs = '<div class="tabs">' + nav.map(function (n) {
      return '<button type="button" data-page="' + (n.id || "") + '" class="' + (page === n.id ? "on" : "") + '">' + esc(n.label) + "</button>";
    }).join("") + "</div>";
    var status = state.published
      ? '<span class="badge live">' + t("公開中", "Live") + "</span>"
      : '<span class="badge">' + t("下書き · 未公開", "Draft · unpublished") + "</span>";
    return '<div class="browser">' + tabs +
      '<div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url"><span>' + esc(h.business_name) + "</span>" + status + "</div></div>" +
      '<div class="site"><div class="snav"><strong>' + esc(h.business_name) + "</strong><span>" + nav.map(function (n) { return esc(n.label); }).join("　") + "</span></div>" + inner +
      '<div class="info"><div><b>' + t("営業", "Hours") + "</b>" + esc(h.hours) + (h.closed ? " / " + esc(h.closed) : "") + "</div>" +
      "<div><b>" + t("アクセス", "Access") + "</b>" + esc(h.station || h.area) + "</div>" +
      "<div><b>" + t("予約", "Booking") + "</b>" + esc(h.reservation || h.phone || "") + "</div></div>" +
      '<div class="foot">' + esc(h.address || h.area) + (h.phone ? "　TEL " + esc(h.phone) : "") + "</div></div></div>";
  }
  function photosRow(ids, mode) {
    if (mode !== "edit") return "";
    return '<div class="photos">' + ids.map(function (id) { return slot(id); }).join("") + "</div>";
  }
  function slot(id) {
    var on = !!state.photos[id];
    var label = on ? t("写真を入れました", "Photo added") : t("ここをクリックして写真を入れる", "Click to add a photo");
    return '<button type="button" class="ph' + (on ? " on" : "") + '" data-ph="' + id + '">' + label + "</button>";
  }

  function excelRow(num, ja, en, val, editable, fieldId) {
    var cell = editable
      ? '<input id="' + (fieldId || "business_name") + '" class="xcell-input" value="' + esc(val) + '">'
      : esc(val || "—");
    return "<tr><td class=\"xnum\">" + num + '</td><td class="xkey">' + t(ja, en) + '</td><td class="xval">' + cell + "</td></tr>";
  }
  function summaryRow(num, row, editable) {
    var label = t(row.label_ja || row.key, row.label_en || row.key);
    var isBiz = row.key === "business_name";
    var isArea = row.key === "area";
    var cell = (editable && (isBiz || isArea))
      ? '<input id="' + (isBiz ? "business_name" : "area") + '" class="xcell-input" value="' + esc(row.value) + '">'
      : esc(row.value || "—");
    return "<tr><td class=\"xnum\">" + num + '</td><td class="xkey">' + label + '</td><td class="xval">' + cell + "</td></tr>";
  }
  function rawRow(num, row) {
    return "<tr><td class=\"xnum\">" + num + '</td><td class="xhead">' + esc(row.header || "") +
      '</td><td class="xval">' + esc(row.value || "—") + "</td></tr>";
  }

  function viewHearing() {
    if (!hasHearing()) {
      return '<div class="upload-stage">' +
        '<div class="upload-icon">↑</div>' +
        "<h2>" + t("ヒアリングシートをアップロード", "Upload hearing sheet") + "</h2>" +
        "<p>" + t("お店の情報が入った CSV または JSON をアップロードすると、AI が日本語原稿を作成します。店名は必須です。", "Upload a CSV or JSON hearing sheet, then AI will write the Japanese copy. Shop name is required.") + "</p>" +
        '<div class="upload-actions">' +
        '<label class="btn g upload-big"><input type="file" id="hearingUp" accept=".csv,.json,.txt,.tsv" hidden>' + t("ファイルを選択", "Choose file") + "</label>" +
        '<button type="button" class="btn w" id="hearingDl">' + t("サンプルCSV", "Sample CSV") + "</button>" +
        "</div>" +
        '<p class="upload-note">' + t("サンプルCSVはそのままアップロードできます。別のお店で試す場合は、2行目を書き換えてからアップロードしてください。", "The sample CSV can be uploaded as-is. For another shop, edit row 2, then upload.") + "</p></div>";
    }
    var h = state.hearing;
    var table = state.hearingTable || buildTableFromHearing(h);
    var tabs = hearingTabs(table, h);
    if (tabs.every(function (tab) { return tab.id !== state.xlsTab; })) {
      state.xlsTab = pickDefaultTab(table);
    }
    var active = state.xlsTab;
    var body = "";
    if (active === "menu") {
      var items = menuOf(h);
      var menuRows = items.length
        ? items.map(function (s, i) {
            return "<tr><td class=\"xnum\">" + (i + 1) + "</td><td class=\"xkey\">" + esc(s.name) +
              '</td><td class="xval">' + esc(s.description || "") + "</td><td class=\"xval\" style=\"white-space:nowrap;font-weight:700\">" +
              esc(s.duration || "") + "<br><span style=\"color:#1f6b48\">" + esc(s.price || "") + "</span></td></tr>";
          }).join("")
        : '<tr><td colspan="4" class="xls-empty">' + t("メニュー行がありません。CSV原文タブで列を確認できます。", "No menu rows. Check CSV fields tab for columns.") + "</td></tr>";
      body = '<thead><tr><th></th><th>' + t("施術", "Service") + "</th><th>" + t("説明", "Description") + "</th><th>" + t("時間・料金", "Time / price") + "</th></tr></thead><tbody>" + menuRows + "</tbody>";
    } else if (active === "sheet") {
      var rawRows = table.raw || [];
      body = rawRows.length
        ? '<thead><tr><th></th><th>' + t("CSV列名", "CSV column") + "</th><th>" + t("値", "Value") + "</th></tr></thead><tbody>" +
          rawRows.map(function (row, i) { return rawRow(i + 1, row); }).join("") + "</tbody>"
        : '<tbody><tr><td colspan="3" class="xls-empty">' + t("表示できるCSV列がありません。", "No CSV columns to show.") + "</td></tr></tbody>";
    } else {
      var summaryRows = table.summary || [];
      body = summaryRows.length
        ? '<thead><tr><th></th><th>' + t("項目", "Field") + "</th><th>" + t("内容", "Value") + "</th></tr></thead><tbody>" +
          summaryRows.map(function (row, i) { return summaryRow(i + 1, row, true); }).join("") + "</tbody>"
        : '<tbody><tr><td colspan="3" class="xls-empty">' + t("整理済み項目がありません。CSV原文タブを確認してください。", "No normalized fields yet. Check CSV fields tab.") + "</td></tr></tbody>";
    }
    var profile = state.hearingProfile ? '<span class="xls-profile">' + esc(state.hearingProfile) + "</span>" : "";
    var tabHtml = tabs.map(function (tab) {
      return '<button type="button" data-xls="' + tab.id + '" class="' + (active === tab.id ? "on" : "") + '">' + t(tab.ja, tab.en) + "</button>";
    }).join("");
    return '<div class="doc">' +
      '<div class="xls-bar"><span>' + esc(state.hearingFile) + profile + '<small>' + t("ヒアリングシート", "Hearing sheet") +
      (state.hearingSource === "upload" ? " · " + t("アップロード", "Uploaded") : "") + "</small></span>" +
      '<div class="xls-actions">' +
      '<label class="xls-up"><input type="file" id="hearingUp" accept=".csv,.json,.txt,.tsv" hidden>' + t("差し替え", "Replace") + "</label>" +
      '<button type="button" class="xls-dl" id="hearingDl">' + t("ダウンロード", "Download") + "</button>" +
      "</div></div>" +
      '<div class="xls-tabs">' + tabHtml + "</div>" +
      '<div class="xls-wrap"><table class="xls-grid">' + body + "</table></div>" +
      '<div class="xls-foot"><p>' + t("内容を確認してから、AI に原稿執筆を依頼できます。", "Review the content, then ask AI to write the copy.") + "</p>" +
      '<div class="actions"><button class="btn g" id="go">' + t("この内容で文章を書く", "Write the copy") + "</button></div></div></div>";
  }
  function viewWrite() { return viewAiStudio(); }
  function viewReview() { return viewAiStudio(); }
  function viewWp() {
    return '<span class="chip b">' + t("WordPress 下書き", "WORDPRESS DRAFT") + "</span>" +
      preview(state.page || "home", "hide") +
      '<div class="decide"><p>' + t("4ページ保存済み。次は写真を入れます。", "4 pages saved. Next, add photos.") +
      '</p><div class="actions" style="margin:0"><button class="btn g" id="toFinish">' + t("写真を入れる", "Add photos") + "</button></div></div>";
  }
  function viewFinish() {
    var ready = Object.keys(state.photos).some(function (k) { return state.photos[k]; });
    var line = state.published
      ? t("公開しました。AIは公開していません。", "Published. AI did not publish.")
      : (ready
        ? t("写真が入りました。公開してよいですか？", "Photos are in. Publish?")
        : t("写真が入るまで、公開できません。", "Cannot publish until a photo is added."));
    return '<span class="chip gold">' + t("写真と公開", "PHOTOS & PUBLISH") + "</span>" +
      preview(state.page || "home", "edit") +
      '<div class="decide"><p>' + line + '</p><div class="actions" style="margin:0"><button class="btn g" id="pub"' +
      (ready && !state.published ? "" : " disabled") + ">" +
      (state.published ? t("公開済み", "Published") : t("公開する", "Publish")) + "</button></div></div>";
  }

  function draw() {
    showDeployNote();
    stepper();
    document.getElementById("brandsub").textContent = t("ホームページ制作デモ", "Homepage production demo");
    document.getElementById("stepslabel").textContent = t("デモの流れ", "DEMO FLOW");
    document.getElementById("say").textContent = t(SAY[state.step][0], SAY[state.step][1]);
    document.getElementById("hint").textContent = t(HINT[state.step][0], HINT[state.step][1]);
    document.getElementById("say").classList.toggle("hid", state.step === "write" || state.step === "review");
    document.getElementById("hint").classList.toggle("hid", state.step === "write" || state.step === "review" || (state.step === "hearing" && !hasHearing()));
    var threadEl = document.querySelector(".ai-thread");
    var keepScroll = threadEl ? threadEl.scrollTop : 0;
    document.getElementById("view").innerHTML = {
      hearing: viewHearing, write: viewWrite, review: viewReview, wp: viewWp, finish: viewFinish
    }[state.step]();
    var go = document.getElementById("go"); if (go) go.onclick = start;
    var again = document.getElementById("again"); if (again) again.onclick = start;
    var ok = document.getElementById("ok"); if (ok) ok.onclick = approve;
    var tf = document.getElementById("toFinish"); if (tf) tf.onclick = function () { state.step = "finish"; state.max = 4; draw(); msg(""); };
    var pub = document.getElementById("pub"); if (pub) pub.onclick = publish;
    document.querySelectorAll("[data-page]").forEach(function (b) {
      b.onclick = function () { state.page = b.getAttribute("data-page"); draw(); };
    });
    document.querySelectorAll("[data-xls]").forEach(function (b) {
      b.onclick = function () { state.xlsTab = b.getAttribute("data-xls"); draw(); };
    });
    var up = document.getElementById("hearingUp");
    if (up) up.onchange = function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) uploadHearing(f).catch(function (err) { msg(err.message || t("読み込めませんでした。", "Could not load.")); });
      e.target.value = "";
    };
    var dl = document.getElementById("hearingDl");
    if (dl) dl.onclick = downloadHearingSheet;
    document.querySelectorAll("[data-ph]").forEach(function (b) {
      b.onclick = function () {
        state.photos[b.getAttribute("data-ph")] = !state.photos[b.getAttribute("data-ph")];
        draw();
      };
    });
    var thread = document.querySelector(".ai-thread");
    if (thread) {
      thread.scrollTop = state.running ? thread.scrollHeight : keepScroll;
    }
  }

  async function sse(res, fn) {
    var r = res.body.getReader(), d = new TextDecoder(), buf = "";
    while (true) {
      var x = await r.read(); if (x.done) break;
      buf += d.decode(x.value, { stream: true });
      var parts = buf.split("\n\n"); buf = parts.pop();
      parts.forEach(function (p) {
        if (p.trim().indexOf("data:") !== 0) return;
        try { fn(JSON.parse(p.trim().slice(5).trim())); } catch (e) {}
      });
    }
  }

  async function start() {
    if (state.running) return;
    if (!hasHearing()) { msg(t("先にヒアリングシートをアップロードしてください。", "Upload the hearing sheet first.")); return; }
    readForm();
    if (!state.hearing.business_name) { msg(t("店名が必要です。", "Shop name is required.")); return; }
    if (isHostedDemo() && !window.DEMO_API_BASE) {
      msg(t("AIを使うには API URL が必要です。?api=... を付けて開いてください。", "Live AI needs an API URL. Open with ?api=..."));
      return;
    }
    if (abort) abort.abort();
    abort = new AbortController();
    state.running = true; state.published = false; state.site = null; state.photos = {};
    state.copy = { heading: "", lead: "", body_paragraphs: [], cta: "" }; state.raw = "";
    state.costUsd = null;
    state.writePhase = 1; state.aiStatus = t("ヒアリング内容を確認しています…", "Reviewing the hearing sheet…");
    state.step = "write"; state.max = 1; draw(); msg("");
    try {
      var res = await fetch(api("/v1/demo/run"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state.hearing), signal: abort.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      await sse(res, function (ev) {
        if (ev.job_id) state.jobId = ev.job_id;
        if (ev.type === "stage") {
          if (ev.id === "hearing") {
            state.writePhase = 1;
            state.aiStatus = t("ヒアリング内容を確認しています…", "Reviewing the hearing sheet…");
          } else if (ev.id === "agent") {
            state.writePhase = 2;
            state.aiStatus = t("トップページ原稿を執筆しています…", "Writing the homepage copy…");
          } else if (ev.id === "review") {
            state.writePhase = 3;
            state.aiStatus = t("並列モデルで事実を固定しています…", "Locking facts with parallel models…");
          }
          if (!timer) timer = setTimeout(function () { timer = null; draw(); }, 80);
        }
        if (ev.type === "token") {
          state.writePhase = 2;
          state.aiStatus = t("トップページ原稿を執筆しています…", "Writing the homepage copy…");
          state.raw += ev.text || "";
          state.copy = { heading: pick(state.raw, "heading"), lead: pick(state.raw, "lead"), cta: pick(state.raw, "cta"), body_paragraphs: pickArr(state.raw) };
          if (!timer) timer = setTimeout(function () { timer = null; draw(); }, 80);
        } else if (ev.type === "copy" || (ev.copy && ev.type !== "error")) {
          if (ev.copy) state.copy = ev.copy;
        }
        if (ev.type === "awaiting_review") {
          state.copy = ev.copy; state.jobId = ev.job_id; state.writePhase = 3; state.costUsd = (ev.estimated_usd == null ? null : ev.estimated_usd);
          state.aiStatus = t("原稿が完成しました。", "Draft complete.");
          state.step = "review"; state.max = 2; draw();
          msg("");
        }
        if (ev.type === "error") throw new Error(L() === "ja" ? (ev.ja || ev.en) : (ev.en || ev.ja));
      });
    } catch (e) {
      if (e.name !== "AbortError") msg(e.message || t("失敗しました。", "Failed."));
    } finally { state.running = false; draw(); }
  }

  async function approve() {
    if (!state.copy.heading) return;
    try {
      var body = Object.assign({}, state.hearing, { approved_copy: state.copy, job_id: state.jobId, decision: "approved" });
      var res = await fetch(api("/v1/demo/compose"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      state.site = data.site; state.copy = data.copy; state.jobId = data.job_id;
      state.step = "wp"; state.max = 3; state.page = "home"; draw();
      msg("");
    } catch (e) { msg(e.message || t("保存できませんでした。", "Could not save.")); }
  }

  function publish() {
    if (!Object.keys(state.photos).some(function (k) { return state.photos[k]; })) return;
    state.published = true; state.step = "finish"; draw();
    msg("");
  }

  async function readUploadText(file) {
    var buf = await file.arrayBuffer();
    var bytes = new Uint8Array(buf);
    if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
      return new TextDecoder("utf-16le").decode(bytes.subarray(2));
    }
    if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
      return new TextDecoder("utf-16be").decode(bytes.subarray(2));
    }
    if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
      return new TextDecoder("utf-8").decode(bytes.subarray(3));
    }
    var utf8 = new TextDecoder("utf-8").decode(bytes);
    if (utf8.indexOf("\uFFFD") === -1) return utf8.replace(/^\uFEFF/, "");
    try {
      return new TextDecoder("shift_jis").decode(bytes);
    } catch (e) {
      return utf8.replace(/^\uFEFF/, "");
    }
  }
  function parseErrorMessage(detail) {
    var text = String(detail || "");
    if (/business_name/i.test(text)) {
      return t("店名（business_name）を入力してから、もう一度アップロードしてください。", "Fill in the shop name (business_name), then upload again.");
    }
    if (/no data row/i.test(text)) {
      return t("CSV にデータ行がありません。1行目は項目名、2行目以降にお店の情報を入れてください。", "CSV has no data row. Keep headers on row 1 and shop data on row 2.");
    }
    return text || t("読み込めませんでした。", "Could not load.");
  }

  function applyHearing(hearing, filename, meta) {
    meta = meta || {};
    state.hearing = hearing;
    if (!state.hearing.area) {
      state.hearing.area = String(state.hearing.address || state.hearing.station || "").trim();
    }
    state.hearingLoaded = true;
    state.hearingSource = "upload";
    state.hearingFile = filename || "hearing-sheet.csv";
    state.hearingProfile = meta.profile || meta.source || "";
    state.hearingTable = meta.table || buildTableFromHearing(hearing);
    state.xlsTab = pickDefaultTab(state.hearingTable);
    state.copy = { heading: "", lead: "", body_paragraphs: [], cta: "" };
    state.site = null;
    state.published = false;
    draw();
    msg(t("ヒアリングを読み込みました。この内容で文章を書けます。", "Hearing loaded. You can write copy from this sheet."), true);
  }

  async function uploadHearing(file) {
    if (/\.(xlsx|xls)$/i.test(file.name)) {
      throw new Error(t("Excel ブックは未対応です。CSV または JSON で保存してアップロードしてください。", "Excel workbooks are not supported. Save as CSV or JSON, then upload."));
    }
    var text = await readUploadText(file);
    var body;
    if (/\.json$/i.test(file.name)) {
      var parsed = JSON.parse(text);
      if (Array.isArray(parsed)) parsed = parsed[0] || {};
      if (parsed && parsed.hearing) parsed = parsed.hearing;
      body = { json: parsed };
    } else {
      body = { csv: text };
    }
    var res = await fetch(api("/v1/demo/hearing/parse"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      var err = {};
      try { err = await res.json(); } catch (e) {}
      throw new Error(parseErrorMessage(err.detail));
    }
    var data = await res.json();
    applyHearing(data.hearing, file.name, { profile: data.source || (data.meta && data.meta.profile), source: data.source, table: data.table || (data.meta && data.meta.table) });
  }


  document.querySelectorAll(".lang button").forEach(function (b) {
    b.onclick = function () {
      document.body.setAttribute("data-lang", b.getAttribute("data-lang"));
      document.documentElement.lang = b.getAttribute("data-lang");
      document.querySelectorAll(".lang button").forEach(function (x) { x.classList.toggle("on", x === b); });
      draw();
    };
  });
  draw();
})();
</script>
